<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aido AI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            height: 100vh;
            overflow: hidden;
        }

        body.dark {
            background: #111827;
            color: #f9fafb;
        }

        .app {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* =========================
           Sidebar
        ========================= */

        .sidebar {
            width: 270px;
            background: #ffffff;
            border-left: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            padding: 18px;
        }

        body.dark .sidebar {
            background: #1f2937;
            border-color: #374151;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .brand-logo,
        .model-logo,
        .welcome-logo {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2563eb;
            color: white;
            font-weight: bold;
        }

        .brand-name {
            font-size: 19px;
            font-weight: bold;
        }

        .brand-version {
            font-size: 12px;
            color: #6b7280;
        }

        .new-chat,
        .side-btn {
            width: 100%;
            border: none;
            background: transparent;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: inherit;
            text-align: right;
        }

        .new-chat {
            background: #2563eb;
            color: white;
            justify-content: center;
            margin-bottom: 22px;
        }

        .new-chat:hover {
            background: #1d4ed8;
        }

        .side-btn:hover {
            background: #f1f5f9;
        }

        body.dark .side-btn:hover {
            background: #374151;
        }

        .icon {
            width: 20px;
            height: 20px;
            display: inline-flex;
        }

        svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sidebar-title {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .history {
            flex: 1;
            overflow-y: auto;
        }

        .history-item {
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 5px;
            font-size: 13px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background: #f1f5f9;
        }

        body.dark .history-item:hover {
            background: #374151;
        }

        .sidebar-bottom {
            border-top: 1px solid #e5e7eb;
            padding-top: 12px;
        }

        body.dark .sidebar-bottom {
            border-color: #374151;
        }

        /* =========================
           Main
        ========================= */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .topbar {
            height: 70px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
        }

        body.dark .topbar {
            background: #1f2937;
            border-color: #374151;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .model-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
        }

        .model-name {
            font-weight: bold;
        }

        .model-subtitle {
            font-size: 12px;
            color: #6b7280;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            color: #16a34a;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #22c55e;
        }

        .mobile-menu {
            display: none;
            border: none;
            background: transparent;
            cursor: pointer;
            color: inherit;
        }

        /* =========================
           Chat
        ========================= */

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 35px 20px;
        }

        .chat-inner {
            max-width: 850px;
            margin: auto;
        }

        .welcome {
            min-height: 55vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .welcome-logo {
            width: 70px;
            height: 70px;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .welcome h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #6b7280;
        }

        .message {
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .message-user {
            align-items: flex-start;
        }

        .message-ai {
            align-items: flex-end;
        }

        .message-bubble {
            max-width: 80%;
            padding: 13px 16px;
            border-radius: 16px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message-user .message-bubble {
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-ai .message-bubble {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 4px;
        }

        body.dark .message-ai .message-bubble {
            background: #1f2937;
            border-color: #374151;
        }

        .message-image {
            max-width: 300px;
            max-height: 300px;
            border-radius: 12px;
            margin-top: 8px;
        }

        /* =========================
           Typing
        ========================= */

        .typing {
            display: none;
            align-items: center;
            gap: 8px;
            color: #6b7280;
            margin-bottom: 20px;
        }

        .typing-dots {
            display: inline-flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background: #6b7280;
            border-radius: 50%;
            animation: typing 1s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: .15s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: .3s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-5px);
            }
        }

        /* =========================
           Input
        ========================= */

        .composer-area {
            padding: 15px 20px 20px;
        }

        .composer {
            max-width: 850px;
            margin: auto;
            position: relative;
        }

        .input-box {
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 18px;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .05);
        }

        body.dark .input-box {
            background: #1f2937;
            border-color: #374151;
        }

        textarea {
            width: 100%;
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: 15px;
            min-height: 45px;
            max-height: 150px;
            padding: 8px;
        }

        .tools {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .tool,
        .send-btn {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: inherit;
            background: #f1f5f9;
        }

        body.dark .tool {
            background: #374151;
        }

        .tool:hover {
            background: #e2e8f0;
        }

        body.dark .tool:hover {
            background: #4b5563;
        }

        .send-btn {
            margin-right: auto;
            background: #2563eb;
            color: white;
        }

        .send-btn:hover {
            background: #1d4ed8;
        }

        .image-container {
            display: none;
            position: relative;
            width: fit-content;
            margin-bottom: 10px;
        }

        #previewImage {
            max-width: 150px;
            max-height: 120px;
            border-radius: 10px;
        }

        #removeImage {
            position: absolute;
            top: -8px;
            left: -8px;
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 50%;
            background: #ef4444;
            color: white;
            cursor: pointer;
            font-size: 18px;
        }

        #imageInput {
            display: none;
        }

        /* =========================
           Voice
        ========================= */

        .voice-panel {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .55);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .voice-box {
            background: white;
            color: #111827;
            width: min(420px, 90%);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
        }

        body.dark .voice-box {
            background: #1f2937;
            color: white;
        }

        .voice-button {
            width: 80px;
            height: 80px;
            border: none;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            cursor: pointer;
            margin: 25px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .voice-close {
            border: none;
            background: #ef4444;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* =========================
           Mobile
        ========================= */

        @media (max-width: 750px) {

            .sidebar {
                position: fixed;
                right: -280px;
                top: 0;
                bottom: 0;
                z-index: 900;
                transition: right .25s ease;
            }

            .sidebar.open {
                right: 0;
            }

            .mobile-menu {
                display: flex;
                width: 38px;
                height: 38px;
                align-items: center;
                justify-content: center;
            }

            .topbar {
                padding: 0 12px;
            }

            .chat {
                padding: 20px 12px;
            }

            .composer-area {
                padding: 10px;
            }

            .message-bubble {
                max-width: 90%;
            }

            .welcome h1 {
                font-size: 22px;
            }
        }

    </style>

</head>


<body>

<div class="app">

    <!-- =========================
         Sidebar
    ========================= -->

    <aside class="sidebar" id="sidebar">

        <div class="brand">

            <div class="brand-logo">
                DA
            </div>

            <div>

                <div class="brand-name">
                    Aido AI
                </div>

                <span class="brand-version">
                    AI Assistant
                </span>

            </div>

        </div>


        <button
            class="new-chat"
            id="newChatBtn"
            type="button"
        >

            <span class="icon">

                <svg viewBox="0 0 24 24">

                    <path d="M12 5v14"></path>

                    <path d="M5 12h14"></path>

                </svg>

            </span>

            <span>
                محادثة جديدة
            </span>

        </button>


        <div class="sidebar-title">
            المحادثات
        </div>


        <div
            class="history"
            id="history"
        ></div>


        <div class="sidebar-bottom">

            <button
                class="side-btn"
                id="themeBtn"
                type="button"
            >

                <span class="icon">

                    <svg viewBox="0 0 24 24">

                        <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.7 6.7 0 0 0 21 12.8z"></path>

                    </svg>

                </span>

                <span id="themeText">
                    الوضع الليلي
                </span>

            </button>


            <button
                class="side-btn"
                id="clearBtn"
                type="button"
            >

                <span class="icon">

                    <svg viewBox="0 0 24 24">

                        <path d="M3 6h18"></path>

                        <path d="M8 6V4h8v2"></path>

                        <path d="M19 6l-1 15H6L5 6"></path>

                        <path d="M10 11v6"></path>

                        <path d="M14 11v6"></path>

                    </svg>

                </span>

                <span>
                    مسح المحادثات
                </span>

            </button>

        </div>

    </aside>


    <!-- =========================
         Main
    ========================= -->

    <main class="main">

        <header class="topbar">

            <div class="topbar-right">

                <button
                    class="mobile-menu"
                    id="mobileMenu"
                    type="button"
                >

                    <span class="icon">

                        <svg viewBox="0 0 24 24">

                            <path d="M4 6h16"></path>

                            <path d="M4 12h16"></path>

                            <path d="M4 18h16"></path>

                        </svg>

                    </span>

                </button>


                <div class="model-logo">
                    DA
                </div>


                <div class="model-info">

                    <div class="model-name">
                        Aido AI
                    </div>

                    <div class="model-subtitle">
                        Gemini AI
                    </div>

                </div>

            </div>


            <div class="status">

                <span class="status-dot"></span>

                <span>
                    متصل
                </span>

            </div>

        </header>


        <section
            class="chat"
            id="chat"
        >

            <div
                class="chat-inner"
                id="chatInner"
            >

                <div
                    class="welcome"
                    id="welcome"
                >

                    <div class="welcome-logo">
                        DA
                    </div>

                    <h1>
                        مرحباً بك في Aido AI
                    </h1>

                    <p>
                        كيف يمكنني مساعدتك اليوم؟
                    </p>

                </div>


                <div
                    class="typing"
                    id="typing"
                >

                    <span>
                        Aido AI يكتب
                    </span>

                    <span class="typing-dots">

                        <span></span>

                        <span></span>

                        <span></span>

                    </span>

                </div>

            </div>

        </section>


        <div class="composer-area">

            <form
                class="composer"
                id="chatForm"
                method="POST"
                enctype="multipart/form-data"
            >

                <div class="input-box">

                    <div
                        class="image-container"
                        id="imageContainer"
                    >

                        <img
                            id="previewImage"
                            src=""
                            alt="الصورة"
                        >

                        <button
                            type="button"
                            id="removeImage"
                        >
                            ×
                        </button>

                    </div>


                    <input
                        type="file"
                        id="imageInput"
                        name="image"
                        accept="image/*"
                    >


                    <textarea
                        id="question"
                        name="question"
                        placeholder="اكتب رسالتك هنا..."
                        rows="1"
                    ></textarea>


                    <div class="tools">

                        <button
                            type="button"
                            class="tool"
                            id="imageBtn"
                            data-tooltip="إضافة صورة"
                        >

                            <svg viewBox="0 0 24 24">

                                <rect
                                    x="3"
                                    y="4"
                                    width="18"
                                    height="16"
                                    rx="2"
                                ></rect>

                                <circle
                                    cx="8.5"
                                    cy="9"
                                    r="1.5"
                                ></circle>

                                <path d="M21 15l-5-5L5 20"></path>

                            </svg>

                        </button>


                        <button
                            type="button"
                            class="tool"
                            id="micBtn"
                            data-tooltip="الميكروفون"
                        >

                            <svg viewBox="0 0 24 24">

                                <rect
                                    x="9"
                                    y="3"
                                    width="6"
                                    height="11"
                                    rx="3"
                                ></rect>

                                <path d="M5 11a7 7 0 0 0 14 0"></path>

                                <path d="M12 18v3"></path>

                                <path d="M8 21h8"></path>

                            </svg>

                        </button>


                        <button
                            type="button"
                            class="tool"
                            id="voiceChatBtn"
                            data-tooltip="المحادثة الصوتية"
                        >

                            <svg viewBox="0 0 24 24">

                                <path d="M12 2v20"></path>

                                <path d="M5 9v6"></path>

                                <path d="M19 9v6"></path>

                                <path d="M8 6v12"></path>

                                <path d="M16 6v12"></path>

                            </svg>

                        </button>


                        <button
                            type="button"
                            class="tool"
                            id="voiceBtn2"
                            data-tooltip="قراءة الإجابة"
                        >

                            <svg viewBox="0 0 24 24">

                                <path d="M11 5L6 9H3v6h3l5 4z"></path>

                                <path d="M15 9a4 4 0 0 1 0 6"></path>

                                <path d="M18 6a8 8 0 0 1 0 12"></path>

                            </svg>

                        </button>


                        <button
                            type="submit"
                            class="send-btn"
                            id="sendBtn"
                        >

                            <svg viewBox="0 0 24 24">

                                <path d="M22 2L11 13"></path>

                                <path d="M22 2l-7 20-4-9-9-4z"></path>

                            </svg>

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </main>

</div>


<!-- =========================
     Voice Panel
========================= -->

<div
    class="voice-panel"
    id="voicePanel"
>

    <div class="voice-box">

        <h2>
            المحادثة الصوتية
        </h2>

        <p id="voiceStatus">
            اضغط لبدء المحادثة
        </p>


        <button
            class="voice-button"
            id="voiceStart"
            type="button"
        >
            بدء المحادثة
        </button>


        <br>


        <button
            class="voice-close"
            id="voiceClose"
            title="إغلاق"
            type="button"
        >
            إغلاق
        </button>

    </div>

</div>


<script>

    const chatForm =
        document.getElementById("chatForm");

    const question =
        document.getElementById("question");

    const chatInner =
        document.getElementById("chatInner");

    const welcome =
        document.getElementById("welcome");

    const typing =
        document.getElementById("typing");

    const imageInput =
        document.getElementById("imageInput");

    const imageBtn =
        document.getElementById("imageBtn");

    const imageContainer =
        document.getElementById("imageContainer");

    const previewImage =
        document.getElementById("previewImage");

    const removeImage =
        document.getElementById("removeImage");

    const newChatBtn =
        document.getElementById("newChatBtn");

    const clearBtn =
        document.getElementById("clearBtn");

    const themeBtn =
        document.getElementById("themeBtn");

    const themeText =
        document.getElementById("themeText");

    const history =
        document.getElementById("history");

    const mobileMenu =
        document.getElementById("mobileMenu");

    const sidebar =
        document.getElementById("sidebar");

    const micBtn =
        document.getElementById("micBtn");

    const voiceBtn2 =
        document.getElementById("voiceBtn2");

    const voiceChatBtn =
        document.getElementById("voiceChatBtn");

    const voicePanel =
        document.getElementById("voicePanel");

    const voiceStart =
        document.getElementById("voiceStart");

    const voiceClose =
        document.getElementById("voiceClose");

    const voiceStatus =
        document.getElementById("voiceStatus");


    let selectedImage = null;

    let lastAnswer = "";

    let messages = [];


    /* =========================
       إضافة رسالة إلى الشاشة
    ========================= */

    function addMessage(
        role,
        text,
        image
    ) {

        const message =
            document.createElement("div");

        message.className =
            "message " +
            (role === "user"
                ? "message-user"
                : "message-ai");


        const bubble =
            document.createElement("div");

        bubble.className =
            "message-bubble";


        if (text) {

            bubble.textContent =
                text;

        }


        if (image) {

            const img =
                document.createElement("img");

            img.src =
                image;

            img.className =
                "message-image";

            img.alt =
                "الصورة";

            bubble.appendChild(img);

        }


        message.appendChild(
            bubble
        );


        chatInner.insertBefore(
            message,
            typing
        );


        const chat =
            document.getElementById(
                "chat"
            );


        chat.scrollTop =
            chat.scrollHeight;

    }


    /* =========================
       إرسال الرسالة
    ========================= */

    chatForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const text =
                question.value.trim();


            if (!text && !selectedImage) {
                return;
            }


            welcome.style.display =
                "none";


            let imageUrl = null;


            if (selectedImage) {

                imageUrl =
                    URL.createObjectURL(
                        selectedImage
                    );

            }


            addMessage(
                "user",
                text,
                imageUrl
            );


            typing.style.display =
                "flex";


            const formData =
                new FormData();


            formData.append(
                "question",
                text
            );


            if (selectedImage) {

                formData.append(
                    "image",
                    selectedImage
                );

            }


            question.value = "";

            question.style.height =
                "45px";


            try {

                const response =
                    await fetch(
                        "/",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const html =
                    await response.text();


                const parser =
                    new DOMParser();


                const doc =
                    parser.parseFromString(
                        html,
                        "text/html"
                    );


                /*
                 * Flask يرسل الإجابة
                 * داخل الصفحة.
                 */

                const answerElement =
                    doc.getElementById(
                        "serverAnswer"
                    );


                let answer = "";


                if (answerElement) {

                    answer =
                        answerElement.textContent.trim();

                }


                /*
                 * إذا لم نجد الإجابة،
                 * نجرب API.
                 */

                if (!answer && text) {

                    const apiResponse =
                        await fetch(
                            "/api/chat",
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },
                                body:
                                    JSON.stringify({
                                        message: text
                                    })
                            }
                        );


                    if (apiResponse.ok) {

                        const data =
                            await apiResponse.json();


                        answer =
                            data.answer || "";

                    }

                }


                if (!answer) {

                    answer =
                        "لم أجد إجابة حاليًا.";

                }


                lastAnswer =
                    answer;


                addMessage(
                    "ai",
                    answer,
                    null
                );


            } catch (error) {

                console.error(
                    "CHAT ERROR:",
                    error
                );


                addMessage(
                    "ai",
                    "حدث خطأ أثناء الاتصال بالخادم: " +
                    error.message,
                    null
                );

            }


            typing.style.display =
                "none";


            removeSelectedImage();

        }
    );


    /* =========================
       رفع صورة
    ========================= */

    imageBtn.addEventListener(
        "click",
        function() {

            imageInput.click();

        }
    );


    imageInput.addEventListener(
        "change",
        function() {

            const file =
                imageInput.files[0];


            if (!file) {
                return;
            }


            selectedImage =
                file;


            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    previewImage.src =
                        event.target.result;

                    imageContainer.style.display =
                        "block";

                };


            reader.readAsDataURL(
                file
            );

        }
    );


    removeImage.addEventListener(
        "click",
        function() {

            removeSelectedImage();

        }
    );


    function removeSelectedImage() {

        selectedImage =
            null;

        imageInput.value =
            "";

        previewImage.src =
            "";

        imageContainer.style.display =
            "none";

    }


    /* =========================
       محادثة جديدة
    ========================= */

    newChatBtn.addEventListener(
        "click",
        function() {

            document
                .querySelectorAll(
                    ".message"
                )
                .forEach(
                    function(element) {

                        element.remove();

                    }
                );


            welcome.style.display =
                "flex";


            question.value =
                "";


            removeSelectedImage();

        }
    );


    /* =========================
       مسح المحادثات
    ========================= */

    clearBtn.addEventListener(
        "click",
        function() {

            document
                .querySelectorAll(
                    ".message"
                )
                .forEach(
                    function(element) {

                        element.remove();

                    }
                );


            welcome.style.display =
                "flex";


            lastAnswer =
                "";

        }
    );


    /* =========================
       الوضع الليلي
    ========================= */

    themeBtn.addEventListener(
        "click",
        function() {

            document.body.classList.toggle(
                "dark"
            );


            if (
                document.body.classList.contains(
                    "dark"
                )
            ) {

                themeText.textContent =
                    "الوضع النهاري";

            } else {

                themeText.textContent =
                    "الوضع الليلي";

            }

        }
    );


    /* =========================
       القائمة في الهاتف
    ========================= */

    mobileMenu.addEventListener(
        "click",
        function() {

            sidebar.classList.toggle(
                "open"
            );

        }
    );


    /* =========================
       تكبير مربع الكتابة
    ========================= */

    question.addEventListener(
        "input",
        function() {

            this.style.height =
                "45px";


            this.style.height =
                Math.min(
                    this.scrollHeight,
                    150
                ) + "px";

        }
    );


    /* =========================
       Enter للإرسال
    ========================= */

    question.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                chatForm.requestSubmit();

            }

        }
    );


    /* =========================
       الميكروفون
    ========================= */

    let recognition = null;


    if (
        "webkitSpeechRecognition"
        in window
    ) {

        recognition =
            new webkitSpeechRecognition();


        recognition.lang =
            "ar-MA";


        recognition.continuous =
            false;


        recognition.interimResults =
            false;


        recognition.onresult =
            function(event) {

                const text =
                    event.results[0][0]
                        .transcript;


                question.value =
                    text;


                question.dispatchEvent(
                    new Event("input")
                );

            };

    }


    micBtn.addEventListener(
        "click",
        function() {

            if (!recognition) {

                alert(
                    "المتصفح لا يدعم التعرف على الصوت."
                );

                return;

            }


            recognition.start();

        }
    );


    /* =========================
       قراءة الإجابة
    ========================= */

    voiceBtn2.addEventListener(
        "click",
        function() {

            if (!lastAnswer) {
                return;
            }


            if (
                "speechSynthesis"
                in window
            ) {

                speechSynthesis.cancel();


                const speech =
                    new SpeechSynthesisUtterance(
                        lastAnswer
                    );


                speech.lang =
                    "ar-MA";


                speech.rate =
                    0.95;


                speechSynthesis.speak(
                    speech
                );

            }

        }
    );


    /* =========================
       المحادثة الصوتية
    ========================= */

    voiceChatBtn.addEventListener(
        "click",
        function() {

            voicePanel.style.display =
                "flex";

        }
    );


    voiceClose.addEventListener(
        "click",
        function() {

            voicePanel.style.display =
                "none";

        }
    );


    voiceStart.addEventListener(
        "click",
        function() {

            if (!recognition) {

                voiceStatus.textContent =
                    "المتصفح لا يدعم المحادثة الصوتية.";

                return;

            }


            voiceStatus.textContent =
                "أستمع إليك...";


            recognition.start();

        }
    );

</script>

</body>

</html>
