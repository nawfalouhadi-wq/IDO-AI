<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IDO AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0
}

body{
    font-family:Arial,sans-serif;
    background:#fff;
    color:#202123;
    height:100vh;
    overflow:hidden
}

body.dark{
    background:#212121;
    color:#eee
}

button{
    font-family:inherit
}

.app{
    display:flex;
    height:100vh
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:260px;
    background:#f7f7f8;
    border-left:1px solid #ddd;
    padding:14px;
    display:flex;
    flex-direction:column
}

body.dark .sidebar{
    background:#171717;
    border-color:#333
}

.logo{
    font-size:21px;
    font-weight:bold;
    padding:12px;
    margin-bottom:8px
}

.new-chat,
.side-btn{
    width:100%;
    padding:11px;
    border:0;
    border-radius:8px;
    cursor:pointer;
    text-align:right;
    background:transparent;
    color:inherit
}

.new-chat{
    border:1px solid #ddd;
    background:#fff;
    margin-bottom:12px
}

body.dark .new-chat{
    background:#222;
    border-color:#444
}

.new-chat:hover,
.side-btn:hover,
.tool:hover,
.answer-btn:hover{
    background:#eee
}

body.dark .new-chat:hover,
body.dark .side-btn:hover,
body.dark .tool:hover,
body.dark .answer-btn:hover{
    background:#333
}

.history-title{
    font-size:13px;
    color:#777;
    margin:8px
}

.history{
    flex:1;
    overflow:auto
}

.history-item{
    padding:10px;
    border-radius:7px;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis
}

.history-item:hover{
    background:#e8e8e8
}

.sidebar-bottom{
    border-top:1px solid #ddd;
    padding-top:8px
}

/* =========================
   MAIN
========================= */

.main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column
}

.topbar{
    height:60px;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px
}

.model-name{
    font-weight:bold
}

.status{
    font-size:13px;
    color:#10a37f
}

.mobile-menu{
    display:none;
    background:none;
    border:0;
    font-size:24px;
    color:inherit
}

.chat{
    flex:1;
    overflow:auto;
    padding:35px 20px 170px
}

/* =========================
   MESSAGES
========================= */

.message{
    max-width:850px;
    margin:0 auto 25px;
    display:flex;
    gap:12px;
    align-items:flex-start
}

.avatar{
    width:35px;
    height:35px;
    min-width:35px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#10a37f;
    color:#fff
}

.message-user .avatar{
    background:#555
}

.message-content{
    flex:1;
    line-height:1.8;
    white-space:pre-wrap;
    word-break:break-word
}

.message-name{
    font-weight:bold;
    margin-bottom:4px
}

.answer-tools,
.tools{
    display:flex;
    gap:5px
}

.answer-tools{
    margin-top:8px
}

.answer-btn,
.tool{
    border:0;
    background:transparent;
    color:#666;
    padding:7px 9px;
    border-radius:7px;
    cursor:pointer
}

body.dark .answer-btn,
body.dark .tool{
    color:#ccc
}

/* =========================
   COMPOSER
========================= */

.composer-area{
    position:fixed;
    bottom:0;
    right:260px;
    left:0;
    padding:30px 20px 18px;
    background:linear-gradient(
        transparent,
        rgba(255,255,255,.96) 25%
    )
}

body.dark .composer-area{
    background:linear-gradient(
        transparent,
        rgba(33,33,33,.97) 25%
    )
}

.composer{
    max-width:850px;
    margin:auto;
    background:#fff;
    border:1px solid #ddd;
    border-radius:14px;
    box-shadow:0 3px 12px #0001;
    padding:10px
}

body.dark .composer{
    background:#2f2f2f;
    border-color:#555
}

.composer textarea{
    width:100%;
    min-height:55px;
    max-height:180px;
    resize:none;
    border:0;
    outline:0;
    background:transparent;
    color:inherit;
    font:16px Arial;
    padding:10px
}

.composer-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center
}

.send-btn{
    border:0;
    background:#10a37f;
    color:#fff;
    width:40px;
    height:40px;
    border-radius:9px;
    cursor:pointer;
    font-size:18px
}

#typing{
    display:none;
    max-width:850px;
    margin:auto;
    color:#777;
    padding:8px
}

#copyMessage{
    display:none;
    position:fixed;
    bottom:125px;
    left:50%;
    transform:translateX(-50%);
    background:#10a37f;
    color:#fff;
    padding:9px 15px;
    border-radius:8px;
    z-index:100
}

/* =================================================
   VOICE CHAT
================================================= */

#voiceChat{
    position:fixed;
    inset:0;
    z-index:9999;
    background:#fff;
    color:#111;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center
}

body.dark #voiceChat{
    background:#171717;
    color:#fff
}

.voice-close{
    position:absolute;
    top:22px;
    right:25px;
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:#eee;
    color:#333;
    font-size:22px;
    cursor:pointer
}

body.dark .voice-close{
    background:#333;
    color:#fff
}

.voice-title{
    position:absolute;
    top:25px;
    left:50%;
    transform:translateX(-50%);
    font-size:20px;
    font-weight:bold
}

.voice-status{
    position:absolute;
    top:65px;
    left:50%;
    transform:translateX(-50%);
    color:#777;
    font-size:14px
}

.voice-orb-area{
    position:relative;
    width:330px;
    height:330px;
    display:flex;
    align-items:center;
    justify-content:center
}

.voice-ring{
    position:absolute;
    width:270px;
    height:270px;
    border-radius:50%;
    border:2px solid #1683ff;
    opacity:.25;
    transition:.2s
}

.voice-ring.two{
    width:310px;
    height:310px;
    opacity:.12
}

.voice-orb{
    width:190px;
    height:190px;
    border-radius:50%;
    background:linear-gradient(
        145deg,
        #1683ff,
        #0055cc
    );
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:27px;
    font-weight:bold;
    box-shadow:
        0 0 35px rgba(0,115,255,.35),
        inset 0 0 25px rgba(255,255,255,.15);
    position:relative;
    z-index:2
}

.voice-bars{
    position:absolute;
    bottom:28px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    height:55px;
    opacity:0
}

.voice-bars span{
    width:4px;
    height:12px;
    background:#1683ff;
    border-radius:5px
}

.voice-active .voice-ring{
    animation:ringPulse 1.5s infinite
}

.voice-active .voice-ring.two{
    animation:ringPulse 1.5s infinite .3s
}

.voice-active .voice-bars{
    opacity:1
}

.voice-active .voice-bars span{
    animation:voiceBar .7s infinite alternate
}

.voice-active .voice-bars span:nth-child(2){
    animation-delay:.1s
}

.voice-active .voice-bars span:nth-child(3){
    animation-delay:.2s
}

.voice-active .voice-bars span:nth-child(4){
    animation-delay:.3s
}

.voice-active .voice-bars span:nth-child(5){
    animation-delay:.15s
}

@keyframes ringPulse{
    0%,100%{
        transform:scale(1);
        opacity:.2
    }

    50%{
        transform:scale(1.08);
        opacity:.55
    }
}

@keyframes voiceBar{
    from{
        height:8px
    }

    to{
        height:42px
    }
}

.voice-message{
    position:absolute;
    bottom:125px;
    width:90%;
    max-width:650px;
    text-align:center;
    font-size:20px;
    line-height:1.7;
    min-height:35px
}

.voice-button{
    position:absolute;
    bottom:35px;
    left:50%;
    transform:translateX(-50%);
    border:0;
    border-radius:30px;
    padding:13px 25px;
    background:#1683ff;
    color:#fff;
    font-size:16px;
    cursor:pointer
}

.voice-button.stop{
    background:#e53935
}

.voice-hint{
    position:absolute;
    bottom:8px;
    color:#888;
    font-size:12px
}

@media(max-width:800px){

.sidebar{
    position:fixed;
    right:-270px;
    top:0;
    bottom:0;
    z-index:10;
    box-shadow:-5px 0 20px #0002;
    transition:.25s
}

.sidebar.open{
    right:0
}

.mobile-menu{
    display:block
}

.composer-area{
    right:0
}

.chat{
    padding:25px 12px 170px
}

.voice-orb-area{
    transform:scale(.85)
}

.voice-message{
    bottom:115px;
    font-size:17px
}

}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

<div class="logo">🤖 IDO AI</div>

<button class="new-chat" id="newChatBtn">
＋ محادثة جديدة
</button>

<div class="history-title">المحادثات</div>

<div class="history" id="history"></div>

<div class="sidebar-bottom">

<button class="side-btn" id="themeBtn">
🌙 الوضع الليلي
</button>

<button class="side-btn" id="clearBtn">
🗑️ مسح المحادثات
</button>

</div>

</aside>

<main class="main">

<header class="topbar">

<button class="mobile-menu" id="mobileMenu">
☰
</button>

<div class="model-name">
Ido AI 🤖
</div>

<div class="status">
🟢 متصل
</div>

</header>

<section class="chat" id="chat"></section>

<div id="typing">
🤖 Ido AI يكتب...
</div>

<div class="composer-area">

<form id="chatForm" class="composer">

<textarea
id="question"
name="question"
placeholder="اكتب رسالتك إلى Ido AI..."
required></textarea>

<div class="composer-bottom">

<div class="tools">

<button
type="button"
class="tool"
id="micBtn"
title="الميكروفون">
🎤
</button>

<!-- زر المحادثة الصوتية الجديدة -->
<button
type="button"
class="tool"
id="voiceChatBtn"
title="المحادثة الصوتية">
🎙️
</button>

<button
type="button"
class="tool"
id="voiceBtn2"
title="قراءة الإجابة">
🔊
</button>

</div>

<button
type="submit"
class="send-btn">
↑
</button>

</div>

</form>
</div>

</main>
</div>

<!-- =================================================
     واجهة المحادثة الصوتية
================================================= -->

<div id="voiceChat">

<button
class="voice-close"
id="voiceClose"
title="إغلاق">
×
</button>

<div class="voice-title">
IDO AI
</div>

<div class="voice-status" id="voiceStatus">
اضغط بدء المحادثة
</div>

<div class="voice-orb-area" id="voiceOrbArea">

<div class="voice-ring"></div>
<div class="voice-ring two"></div>

<div class="voice-orb">
IDO AI
</div>

<div class="voice-bars">

<span></span>
<span></span>
<span></span>
<span></span>
<span></span>

</div>

</div>

<div class="voice-message" id="voiceMessage"></div>

<button
class="voice-button"
id="voiceStart">
🎙️ بدء المحادثة
</button>

<div class="voice-hint">
تحدث بشكل طبيعي، وسيجيبك Ido AI تلقائيًا
</div>

</div>

<div id="copyMessage">
✅ تم نسخ الرد
</div>

<!-- إجابة Flask -->
<div id="answer" style="display:none;">{{ answer }}</div>

<script>

const $=id=>document.getElementById(id);

const body=document.body;
const sidebar=$("sidebar");
const historyBox=$("history");
const question=$("question");
const chat=$("chat");
const typing=$("typing");

let currentConversationId=
localStorage.getItem("ido_current_conversation");

let conversations=
JSON.parse(
localStorage.getItem("ido_conversations")||"[]"
);

let userName=
localStorage.getItem("ido_user_name");

if(!userName){

userName=prompt(
"السلام عليكم ورحمة الله وبركاته\nما اسمك؟"
);

if(userName&&userName.trim()){

userName=userName.trim();

localStorage.setItem(
"ido_user_name",
userName
);

}
}

/* =========================
   الوضع الليلي
========================= */

if(localStorage.getItem("ido_theme")==="dark"){

body.classList.add("dark");

$("themeBtn").textContent=
"☀️ الوضع النهاري";

}

$("themeBtn").onclick=()=>{

body.classList.toggle("dark");

const dark=
body.classList.contains("dark");

localStorage.setItem(
"ido_theme",
dark?"dark":"light"
);

$("themeBtn").textContent=
dark
?"☀️ الوضع النهاري"
:"🌙 الوضع الليلي";

};

/* =========================
   القائمة
========================= */

$("mobileMenu").onclick=()=>{

sidebar.classList.toggle("open");

};

/* =========================
   المحادثات
========================= */

function createConversation(){

return{

id:Date.now().toString(),

title:"محادثة جديدة",

messages:[],

created:new Date().toISOString(),

updated:new Date().toISOString()

};

}

function saveConversations(){

localStorage.setItem(
"ido_conversations",
JSON.stringify(conversations)
);

}

function getCurrentConversation(){

return conversations.find(
c=>c.id===currentConversationId
)||null;

}

/* =========================
   الترحيب
========================= */

function showWelcome(){

chat.innerHTML=`

<div class="welcome">

<div class="welcome-icon">
🤖
</div>

<h1>
مرحبًا${userName?" يا "+userName:""} 👋
</h1>

<p>
كيف يمكنني مساعدتك اليوم؟
</p>

</div>

`;

}

/* =========================
   إضافة رسالة
========================= */

function addMessage(sender,text,save=true){

const message=
document.createElement("div");

message.className=
"message "+
(sender==="user"
?"message-user"
:"message-ai");

const avatar=
document.createElement("div");

avatar.className="avatar";

avatar.textContent=
sender==="user"
?"👤"
:"🤖";

const content=
document.createElement("div");

content.className="message-content";

const name=
document.createElement("div");

name.className="message-name";

name.textContent=
sender==="user"
?"أنت"
:"Ido AI";

const textBox=
document.createElement("div");

textBox.className="message-text";

textBox.textContent=text;

content.appendChild(name);
content.appendChild(textBox);

if(sender==="ai"){

const tools=
document.createElement("div");

tools.className="answer-tools";

const voice=
document.createElement("button");

voice.className="answer-btn";
voice.type="button";
voice.textContent="🔊 قراءة";

voice.onclick=()=>{
speakText(text,voice);
};

const copy=
document.createElement("button");

copy.className="answer-btn";
copy.type="button";
copy.textContent="📋 نسخ";

copy.onclick=async()=>{

try{

await navigator.clipboard.writeText(text);

$("copyMessage").style.display="block";

setTimeout(
()=>$("copyMessage").style.display="none",
1800
);

}catch(e){}

};

tools.appendChild(voice);
tools.appendChild(copy);

content.appendChild(tools);

}

message.appendChild(avatar);
message.appendChild(content);

chat.appendChild(message);

if(save){

const conversation=
getCurrentConversation();

if(conversation){

conversation.messages.push({
sender:sender,
text:text
});

conversation.updated=
new Date().toISOString();

}

saveConversations();
renderHistory();

}

chat.scrollTop=
chat.scrollHeight;

}

/* =========================
   عرض المحادثة
========================= */

function showConversation(conversation){

chat.innerHTML="";

if(!conversation.messages.length){

showWelcome();
return;

}

conversation.messages.forEach(message=>{

addMessage(
message.sender,
message.text,
false
);

});

chat.scrollTop=
chat.scrollHeight;

}

function renderHistory(){

historyBox.innerHTML="";

[...conversations]
.sort(
(a,b)=>
new Date(b.updated)-
new Date(a.updated)
)
.forEach(conversation=>{

const item=
document.createElement("div");

item.className="history-item";

item.textContent=
conversation.title||
"محادثة جديدة";

item.onclick=()=>{

currentConversationId=
conversation.id;

localStorage.setItem(
"ido_current_conversation",
currentConversationId
);

showConversation(conversation);

if(innerWidth<=800){

sidebar.classList.remove("open");

}

};

historyBox.appendChild(item);

});

}

function loadCurrentConversation(){

const conversation=
getCurrentConversation();

if(conversation){

showConversation(conversation);

}else{

showWelcome();

}

}

/* =========================
   محادثة جديدة
========================= */

$("newChatBtn").onclick=()=>{

const conversation=
createConversation();

conversations.unshift(conversation);

currentConversationId=
conversation.id;

localStorage.setItem(
"ido_current_conversation",
currentConversationId
);

saveConversations();

showWelcome();

renderHistory();

question.value="";

};

/* =========================
   مسح المحادثات
========================= */

$("clearBtn").onclick=()=>{

if(!confirm(
"هل تريد حذف جميع المحادثات؟"
))return;

conversations=[];

currentConversationId=null;

localStorage.removeItem(
"ido_current_conversation"
);

saveConversations();

showWelcome();

renderHistory();

};

/* =========================
   حجم مربع الكتابة
========================= */

question.oninput=()=>{

question.style.height="auto";

question.style.height=
Math.min(
question.scrollHeight,
180
)+"px";

};

/* =========================
   إرسال السؤال
========================= */

async function askServer(text){

const response=
await fetch(
"/",
{
method:"POST",

headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},

body:new URLSearchParams({
question:text
})

}
);

if(!response.ok){

throw new Error(
"HTTP "+response.status
);

}

const html=
await response.text();

const doc=
new DOMParser().parseFromString(
html,
"text/html"
);

const answerElement=
doc.querySelector("#answer");

return answerElement
?answerElement.textContent.trim()
:"";

}

$("chatForm").onsubmit=async e=>{

e.preventDefault();

const text=
question.value.trim();

if(!text)return;

let conversation=
getCurrentConversation();

if(!conversation){

conversation=
createConversation();

conversations.unshift(
conversation
);

currentConversationId=
conversation.id;

localStorage.setItem(
"ido_current_conversation",
currentConversationId
);

}

if(!conversation.messages.length){

conversation.title=
text.length>35
?text.substring(0,35)+"..."
:text;

}

addMessage("user",text);

question.value="";

question.style.height="55px";

typing.style.display="block";

try{

const answer=
await askServer(text);

typing.style.display="none";

addMessage(
"ai",
answer||
"حدث خطأ: لم تصل إجابة من الخادم."
);

}catch(error){

typing.style.display="none";

addMessage(
"ai",
"حدث خطأ أثناء الاتصال بالخادم: "+
error.message
);

}

};

/* =================================================
   القراءة العادية
================================================= */

let speaking=false;

function detectLanguage(text){

const arabic=
(text.match(/[\u0600-\u06FF]/g)||[]).length;

const latin=
(text.match(/[A-Za-z]/g)||[]).length;

if(arabic>latin){

return"ar-SA";

}

if(latin>0){

return"en-US";

}

return"ar-SA";

}

function cleanForVoice(text){

return text
.replace(/https?:\/\/\S+/gi," ")
.replace(/[🤖👤😊😄😂🤣😍🥰😘😎👍❤️💬🔊📋🎤🧮🌍🇲🇦🇫🇷⏰☀️🌙🗑️＋↑]/gu," ")
.replace(/[\*\_\#\~\`|\\]/g," ")
.replace(/\s+/g," ")
.trim();

}

function getVoice(language){

const voices=
window.speechSynthesis.getVoices();

if(!voices.length)return null;

let voice=
voices.find(
v=>v.lang &&
v.lang.toLowerCase()===language.toLowerCase()
);

if(voice)return voice;

return voices.find(
v=>v.lang &&
v.lang.toLowerCase().startsWith(
language.substring(0,2)
)
)||null;

}

function speakText(text,button){

if(!("speechSynthesis" in window)){

alert(
"المتصفح لا يدعم قراءة النص."
);

return;

}

if(speaking){

speechSynthesis.cancel();

speaking=false;

if(button)
button.textContent="🔊 قراءة";

return;

}

const cleanText=
cleanForVoice(text);

if(!cleanText)return;

speechSynthesis.cancel();

const language=
detectLanguage(cleanText);

const voice=
getVoice(language);

const utterance=
new SpeechSynthesisUtterance(
cleanText
);

utterance.lang=language;

if(voice)
utterance.voice=voice;

utterance.rate=.85;
utterance.pitch=1;
utterance.volume=1;

utterance.onstart=()=>{

speaking=true;

if(button)
button.textContent="⏹ إيقاف";

};

utterance.onend=()=>{

speaking=false;

if(button)
button.textContent="🔊 قراءة";

};

utterance.onerror=()=>{

speaking=false;

if(button)
button.textContent="🔊 قراءة";

};

speechSynthesis.speak(
utterance
);

}

/* =========================
   زر القراءة السفلي
========================= */

$("voiceBtn2").onclick=()=>{

const conversation=
getCurrentConversation();

if(!conversation)return;

const lastAI=
[...conversation.messages]
.reverse()
.find(
m=>m.sender==="ai"
);

if(lastAI){

speakText(
lastAI.text,
$("voiceBtn2")
);

}

};

/* =================================================
   الميكروفون العادي
================================================= */

const SpeechRecognition=
window.SpeechRecognition||
window.webkitSpeechRecognition;

let recognition=null;

if(SpeechRecognition){

recognition=
new SpeechRecognition();

recognition.lang="ar-SA";
recognition.continuous=false;
recognition.interimResults=false;

$("micBtn").onclick=()=>{

try{

recognition.start();

$("micBtn").textContent="🔴";

}catch(e){}

};

recognition.onresult=e=>{

question.value=
e.results[0][0].transcript;

question.dispatchEvent(
new Event("input")
);

};

recognition.onend=()=>{

$("micBtn").textContent="🎤";

};

recognition.onerror=()=>{

$("micBtn").textContent="🎤";

};

}

/* =================================================
   VOICE CHAT
================================================= */

const voiceChat=$("voiceChat");
const voiceStart=$("voiceStart");
const voiceClose=$("voiceClose");
const voiceStatus=$("voiceStatus");
const voiceMessage=$("voiceMessage");
const voiceOrbArea=$("voiceOrbArea");

let voiceMode=false;
let voiceListening=false;

function openVoiceChat(){

voiceChat.style.display="flex";

voiceMode=false;
voiceListening=false;

voiceStatus.textContent=
"اضغط بدء المحادثة";

voiceMessage.textContent="";

voiceStart.textContent=
"🎙️ بدء المحادثة";

voiceStart.classList.remove("stop");

voiceOrbArea.classList.remove(
"voice-active"
);

}

function closeVoiceChat(){

voiceMode=false;
voiceListening=false;

if(recognition){

try{
recognition.stop();
}catch(e){}

}

speechSynthesis.cancel();

voiceChat.style.display="none";

voiceOrbArea.classList.remove(
"voice-active"
);

voiceStart.textContent=
"🎙️ بدء المحادثة";

voiceStart.classList.remove("stop");

voiceStatus.textContent=
"اضغط بدء المحادثة";

voiceMessage.textContent="";

}

$("voiceChatBtn").onclick=
openVoiceChat;

voiceClose.onclick=
closeVoiceChat;

/* =========================
   بدء الاستماع
========================= */

function startVoiceListening(){

if(!SpeechRecognition){

voiceStatus.textContent=
"المتصفح لا يدعم المحادثة الصوتية";

return;

}

voiceListening=true;

voiceStatus.textContent=
"🎙️ أستمع إليك...";

voiceMessage.textContent=
"تحدث الآن";

voiceOrbArea.classList.add(
"voice-active"
);

try{

recognition=
new SpeechRecognition();

recognition.lang="ar-SA";
recognition.continuous=false;
recognition.interimResults=false;

recognition.onresult=
async e=>{

const text=
e.results[0][0].transcript.trim();

if(!text)return;

voiceListening=false;

voiceStatus.textContent=
"🤖 أفكر...";

voiceMessage.textContent=
text;

try{

const answer=
await askServer(text);

voiceStatus.textContent=
"🔊 Ido AI يتحدث...";

voiceMessage.textContent=
answer;

await speakVoiceAnswer(answer);

if(voiceMode){

setTimeout(
startVoiceListening,
700
);

}

}catch(error){

voiceStatus.textContent=
"حدث خطأ";

voiceMessage.textContent=
error.message;

if(voiceMode){

setTimeout(
startVoiceListening,
1200
);

}

}

};

recognition.onend=()=>{

if(
voiceMode &&
voiceListening
){

voiceListening=false;

}

};

recognition.onerror=e=>{

console.error(
"Voice recognition error:",
e
);

voiceListening=false;

if(voiceMode){

voiceStatus.textContent=
"لم أسمعك، حاول مرة أخرى";

setTimeout(
startVoiceListening,
1000
);

}

};

recognition.start();

}catch(error){

console.error(error);

voiceListening=false;

}

}

/* =========================
   قراءة جواب Voice Chat
========================= */

function speakVoiceAnswer(text){

return new Promise(resolve=>{

if(!text){

resolve();

return;

}

speechSynthesis.cancel();

const cleanText=
cleanForVoice(text);

const language=
detectLanguage(cleanText);

const voice=
getVoice(language);

const utterance=
new SpeechSynthesisUtterance(
cleanText
);

utterance.lang=language;

if(voice){

utterance.voice=voice;

}

utterance.rate=.85;
utterance.pitch=1;
utterance.volume=1;

voiceOrbArea.classList.add(
"voice-active"
);

utterance.onend=()=>{

voiceOrbArea.classList.remove(
"voice-active"
);

resolve();

};

utterance.onerror=()=>{

voiceOrbArea.classList.remove(
"voice-active"
);

resolve();

};

speechSynthesis.speak(
utterance
);

});

}

/* =========================
   زر تشغيل / إيقاف
========================= */

voiceStart.onclick=()=>{

if(!voiceMode){

voiceMode=true;

voiceStart.textContent=
"⏹ إنهاء المحادثة";

voiceStart.classList.add("stop");

voiceStatus.textContent=
"جاهز للاستماع إليك";

startVoiceListening();

}else{

closeVoiceChat();

}

};

/* =========================
   تحميل الأصوات
========================= */

if("speechSynthesis" in window){

speechSynthesis.onvoiceschanged=()=>{

speechSynthesis.getVoices();

};

}

/* =========================
   البداية
========================= */

renderHistory();

loadCurrentConversation();

window.onbeforeunload=()=>{

speechSynthesis.cancel();

};

</script>
