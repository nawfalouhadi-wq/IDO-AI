<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Aido AI - مساعد الذكاء الاصطناعي">
    <meta name="theme-color" content="#2563eb">

    <title>Aido AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;

            --background: #f5f7fb;
            --surface: #ffffff;
            --surface-2: #f1f5f9;

            --border: #e5e7eb;

            --text: #1f2937;
            --muted: #6b7280;

            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;

            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);

            --radius: 12px;

            --custom-background: none;
        }

        body.dark {
            --background: #111827;
            --surface: #1f2937;
            --surface-2: #374151;
            --border: #4b5563;

            --text: #f9fafb;
            --muted: #9ca3af;

            --shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;

            background:
                var(--custom-background),
                var(--background);

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            color: var(--text);

            overflow: hidden;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }

        body.has-background::before {
            content: "";

            position: fixed;

            inset: 0;

            background: rgba(255, 255, 255, 0.72);

            z-index: -1;

            pointer-events: none;
        }

        body.dark.has-background::before {
            background: rgba(0, 0, 0, 0.55);
        }

        button,
        textarea,
        input {
            font-family: inherit;
        }

        button {
            border: none;
        }

        button:focus-visible,
        textarea:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* =====================================================
           APP
        ===================================================== */

        .app {
            width: 100%;
            height: 100vh;

            display: flex;
        }

        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {
            width: 270px;
            height: 100%;

            flex-shrink: 0;

            background: rgba(255, 255, 255, 0.94);

            border-left: 1px solid var(--border);

            display: flex;
            flex-direction: column;

            padding: 18px;

            z-index: 900;

            transition: right 0.25s ease;

            backdrop-filter: blur(18px);
        }

        body.dark .sidebar {
            background: rgba(31, 41, 55, 0.94);
        }

        .brand {
            display: flex;
            align-items: center;

            gap: 12px;

            margin-bottom: 25px;
        }

        .brand-logo,
        .model-logo,
        .welcome-logo {
            display: flex;

            align-items: center;
            justify-content: center;

            background: var(--primary);

            color: #ffffff;

            font-weight: bold;
        }

        .brand-logo {
            width: 46px;
            height: 46px;

            border-radius: 14px;
        }

        .brand-name {
            font-size: 19px;
            font-weight: bold;
        }

        .brand-version {
            display: block;

            margin-top: 3px;

            color: var(--muted);

            font-size: 12px;
        }

        .new-chat,
        .side-btn {
            width: 100%;
            min-height: 44px;

            padding: 11px 12px;

            border-radius: 10px;

            cursor: pointer;

            display: flex;
            align-items: center;

            gap: 10px;

            color: var(--text);

            background: transparent;

            font-size: 14px;

            text-align: right;

            transition:
                background 0.2s ease,
                transform 0.1s ease;
        }

        .new-chat {
            justify-content: center;

            background: var(--primary);

            color: #ffffff;

            margin-bottom: 14px;
        }

        .new-chat:hover {
            background: var(--primary-hover);
        }

        .side-btn:hover {
            background: var(--surface-2);
        }

        .new-chat:active,
        .side-btn:active,
        .tool:active,
        .send-btn:active,
        .message-action:active {
            transform: scale(0.97);
        }

        .icon {
            width: 20px;
            height: 20px;

            display: inline-flex;

            flex-shrink: 0;
        }

        svg {
            width: 100%;
            height: 100%;

            fill: none;

            stroke: currentColor;

            stroke-width: 1.8;

            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sidebar-title {
            color: var(--muted);

            font-size: 13px;

            margin-bottom: 8px;
        }

        /* =====================================================
           HISTORY SEARCH
        ===================================================== */

        .history-search {
            width: 100%;

            height: 38px;

            margin-bottom: 10px;

            padding: 0 11px;

            border: 1px solid var(--border);

            border-radius: 9px;

            background: var(--surface);

            color: var(--text);

            font-size: 13px;

            outline: none;
        }

        .history-search:focus {
            border-color: var(--primary);
        }

        .history {
            flex: 1;

            overflow-y: auto;

            padding-left: 2px;
        }

        .history-item {
            position: relative;

            padding: 10px 34px 10px 10px;

            margin-bottom: 5px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 13px;

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;

            transition: background 0.2s ease;
        }

        .history-item:hover {
            background: var(--surface-2);
        }

        .history-item-title {
            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }

        .history-item-date {
            color: var(--muted);

            font-size: 10px;

            margin-top: 3px;
        }

        .history-delete {
            position: absolute;

            left: 7px;
            top: 50%;

            transform: translateY(-50%);

            width: 25px;
            height: 25px;

            border-radius: 7px;

            background: transparent;

            color: var(--muted);

            cursor: pointer;

            opacity: 0;

            transition:
                opacity 0.2s ease,
                background 0.2s ease,
                color 0.2s ease;
        }

        .history-item:hover .history-delete {
            opacity: 1;
        }

        .history-delete:hover {
            background: rgba(239, 68, 68, 0.12);

            color: var(--danger);
        }

        .history-empty {
            color: var(--muted);

            font-size: 13px;

            text-align: center;

            padding: 20px 10px;
        }

        .sidebar-bottom {
            border-top: 1px solid var(--border);

            padding-top: 12px;

            margin-top: 8px;
        }

        /* =====================================================
           MAIN
        ===================================================== */

        .main {
            flex: 1;

            min-width: 0;

            height: 100%;

            display: flex;

            flex-direction: column;
        }

        /* =====================================================
           TOPBAR
        ===================================================== */

        .topbar {
            height: 70px;

            flex-shrink: 0;

            padding: 0 22px;

            background: rgba(255, 255, 255, 0.94);

            border-bottom: 1px solid var(--border);

            display: flex;

            align-items: center;

            justify-content: space-between;

            backdrop-filter: blur(18px);
        }

        body.dark .topbar {
            background: rgba(31, 41, 55, 0.94);
        }

        .topbar-right {
            display: flex;

            align-items: center;

            gap: 10px;
        }

        .model-logo {
            width: 40px;
            height: 40px;

            border-radius: 12px;
        }

        .model-name {
            font-weight: bold;
        }

        .model-subtitle {
            color: var(--muted);

            font-size: 12px;

            margin-top: 2px;
        }

        .status {
            display: flex;

            align-items: center;

            gap: 7px;

            color: #16a34a;

            font-size: 13px;

            transition: color 0.2s ease;
        }

        .status.offline {
            color: var(--danger);
        }

        .status-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: var(--success);

            box-shadow:
                0 0 0 3px rgba(34, 197, 94, 0.12);
        }

        .status-dot.offline {
            background: var(--danger);

            box-shadow:
                0 0 0 3px rgba(239, 68, 68, 0.12);
        }

        .mobile-menu {
            display: none;

            width: 38px;
            height: 38px;

            border-radius: 10px;

            background: transparent;

            color: var(--text);

            cursor: pointer;

            align-items: center;
            justify-content: center;
        }

        .mobile-menu:hover {
            background: var(--surface-2);
        }

        /* =====================================================
           CHAT
        ===================================================== */

        .chat {
            flex: 1;

            overflow-y: auto;

            padding: 35px 20px;

            scroll-behavior: smooth;
        }

        .chat-inner {
            width: 100%;

            max-width: 850px;

            margin: 0 auto;
        }

        .welcome {
            min-height: 55vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;
        }

        .welcome.hidden {
            display: none;
        }

        .welcome-logo {
            width: 72px;
            height: 72px;

            border-radius: 20px;

            font-size: 23px;

            margin-bottom: 20px;

            box-shadow:
                0 10px 30px rgba(37, 99, 235, 0.18);
        }

        .welcome h1 {
            font-size: 28px;

            margin-bottom: 10px;
        }

        .welcome p {
            color: var(--muted);
        }

        /* =====================================================
           MESSAGES
        ===================================================== */

        .message {
            display: flex;

            flex-direction: column;

            gap: 6px;

            margin-bottom: 22px;

            animation: messageAppear 0.2s ease;
        }

        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-user {
            align-items: flex-start;
        }

        .message-ai {
            align-items: flex-end;
        }

        .message-label {
            color: var(--muted);

            font-size: 12px;

            padding: 0 5px;
        }

        .message-bubble {
            max-width: 82%;

            padding: 13px 16px;

            border-radius: 16px;

            line-height: 1.7;

            white-space: pre-wrap;

            word-break: break-word;

            overflow-wrap: anywhere;
        }

        .message-user .message-bubble {
            background: var(--primary);

            color: #ffffff;

            border-bottom-right-radius: 4px;
        }

        .message-ai .message-bubble {
            background: rgba(255, 255, 255, 0.94);

            border: 1px solid var(--border);

            border-bottom-left-radius: 4px;

            backdrop-filter: blur(10px);
        }

        body.dark .message-ai .message-bubble {
            background: rgba(31, 41, 55, 0.94);
        }

        .message-image {
            max-width: 300px;
            max-height: 300px;

            border-radius: 12px;

            object-fit: contain;

            margin-top: 8px;

            border: 1px solid var(--border);
        }

        /* =====================================================
           MESSAGE ACTIONS
        ===================================================== */

        .message-actions {
            display: flex;

            gap: 7px;

            margin-top: 4px;
        }

        .message-action {
            min-width: 38px;
            height: 36px;

            padding: 0 10px;

            border: 1px solid var(--border);

            border-radius: 9px;

            background: var(--surface);

            color: var(--text);

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 6px;

            transition:
                background 0.2s ease,
                transform 0.1s ease,
                border-color 0.2s ease;
        }

        .message-action:hover {
            background: var(--surface-2);

            border-color: var(--primary);
        }

        .message-action .icon {
            width: 17px;
            height: 17px;
        }

        .message-action-label {
            font-size: 12px;
        }

        /* =====================================================
           TYPING
        ===================================================== */

        .typing {
            display: none;

            align-items: center;

            gap: 8px;

            color: var(--muted);

            margin-bottom: 20px;

            padding: 0 5px;
        }

        .typing.show {
            display: flex;
        }

        .typing-dots {
            display: inline-flex;

            gap: 4px;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: var(--muted);

            animation: typing 1s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes typing {
            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-5px);
            }
        }

        /* =====================================================
           COMPOSER
        ===================================================== */

        .composer-area {
            flex-shrink: 0;

            padding: 15px 20px 20px;
        }

        .composer {
            max-width: 850px;

            margin: 0 auto;
        }

        .input-box {
            background: rgba(255, 255, 255, 0.94);

            border: 1px solid var(--border);

            border-radius: 18px;

            padding: 12px;

            box-shadow: var(--shadow);

            backdrop-filter: blur(15px);
        }

        body.dark .input-box {
            background: rgba(31, 41, 55, 0.94);
        }

        textarea {
            width: 100%;

            min-height: 45px;
            max-height: 150px;

            padding: 8px;

            border: none;
            outline: none;

            resize: none;

            background: transparent;

            color: var(--text);

            font-size: 15px;

            line-height: 1.6;

            overflow-y: auto;
        }

        textarea::placeholder {
            color: var(--muted);
        }

        .composer-meta {
            display: flex;

            justify-content: flex-start;

            padding: 0 7px 5px;

            color: var(--muted);

            font-size: 10px;
        }

        .tools {
            display: flex;

            align-items: center;

            gap: 7px;
        }

        .tool,
        .send-btn {
            width: 40px;
            height: 40px;

            border-radius: 10px;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;

            transition:
                background 0.2s ease,
                transform 0.1s ease,
                opacity 0.2s ease;
        }

        .tool {
            background: var(--surface-2);

            color: var(--text);

            border: 1px solid transparent;
        }

        .tool:hover {
            background: var(--border);

            border-color: var(--primary);
        }

        .tool.active {
            background: var(--danger);

            color: #ffffff;
        }

        .send-btn {
            margin-right: auto;

            background: var(--primary);

            color: #ffffff;
        }

        .send-btn:hover {
            background: var(--primary-hover);
        }

        .send-btn:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }

        /* =====================================================
           IMAGE
        ===================================================== */

        #imageInput,
        #backgroundInput {
            display: none;
        }

        .image-container {
            display: none;

            position: relative;

            width: fit-content;

            margin-bottom: 10px;
        }

        .image-container.show {
            display: block;
        }

        #previewImage {
            max-width: 150px;
            max-height: 120px;

            border-radius: 10px;

            object-fit: cover;

            border: 1px solid var(--border);
        }

        #removeImage {
            position: absolute;

            top: -8px;
            left: -8px;

            width: 24px;
            height: 24px;

            border-radius: 50%;

            background: var(--danger);

            color: #ffffff;

            cursor: pointer;

            font-size: 18px;

            line-height: 20px;
        }

        /* =====================================================
           TOAST
        ===================================================== */

        .toast-container {
            position: fixed;

            right: 20px;
            bottom: 20px;

            z-index: 5000;

            display: flex;

            flex-direction: column;

            gap: 8px;

            pointer-events: none;
        }

        .toast {
            min-width: 220px;
            max-width: 340px;

            padding: 12px 15px;

            border-radius: 12px;

            background: rgba(31, 41, 55, 0.95);

            color: #ffffff;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.18);

            font-size: 13px;

            animation:
                toastIn 0.25s ease,
                toastOut 0.25s ease 2.75s forwards;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes toastOut {
            to {
                opacity: 0;
                transform: translateY(10px);
            }
        }

        /* =====================================================
           VOICE EXPERIENCE
        ===================================================== */

        .voice-panel {
            display: none;

            position: fixed;

            inset: 0;

            z-index: 2000;

            background:
                radial-gradient(
                    circle at center,
                    rgba(37, 99, 235, 0.18),
                    rgba(0, 0, 0, 0.92)
                );

            align-items: center;
            justify-content: center;

            padding: 20px;

            backdrop-filter: blur(18px);
        }

        .voice-panel.show {
            display: flex;
        }

        .voice-box {
            width: min(700px, 95%);

            min-height: min(650px, 90vh);

            padding: 45px 30px;

            border-radius: 32px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.12),
                    rgba(255, 255, 255, 0.04)
                );

            border: 1px solid rgba(255, 255, 255, 0.16);

            color: #ffffff;

            text-align: center;

            box-shadow:
                0 30px 100px rgba(0, 0, 0, 0.45);

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            position: relative;

            overflow: hidden;
        }

        .voice-title {
            font-size: 30px;

            font-weight: 700;

            margin-bottom: 8px;
        }

        .voice-subtitle {
            color: rgba(255, 255, 255, 0.65);

            font-size: 15px;

            margin-bottom: 45px;
        }

        .voice-ai {
            position: relative;

            width: 230px;
            height: 230px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-bottom: 40px;
        }

        .voice-ai::before,
        .voice-ai::after {
            content: "";

            position: absolute;

            border-radius: 50%;

            border: 1px solid rgba(96, 165, 250, 0.35);

            opacity: 0;

            transform: scale(0.7);
        }

        .voice-ai::before {
            width: 180px;
            height: 180px;
        }

        .voice-ai::after {
            width: 230px;
            height: 230px;
        }

        .voice-ai.active::before {
            animation: voicePulse 1.8s infinite;
        }

        .voice-ai.active::after {
            animation:
                voicePulse 1.8s infinite 0.4s;
        }

        @keyframes voicePulse {
            0% {
                opacity: 0;
                transform: scale(0.7);
            }

            35% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: scale(1.2);
            }
        }

        .voice-core {
            width: 125px;
            height: 125px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #ffffff,
                    #60a5fa 28%,
                    #2563eb 62%,
                    #1e3a8a
                );

            box-shadow:
                0 0 35px rgba(59, 130, 246, 0.55),
                0 0 80px rgba(37, 99, 235, 0.25);

            display: flex;

            align-items: center;
            justify-content: center;

            position: relative;

            z-index: 2;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .voice-core span {
            font-size: 42px;

            font-weight: 800;

            letter-spacing: 2px;

            color: #ffffff;

            text-shadow:
                0 2px 15px rgba(0, 0, 0, 0.25);
        }

        .voice-ai.active .voice-core {
            animation:
                voiceCore 0.9s ease-in-out infinite alternate;
        }

        @keyframes voiceCore {
            from {
                transform: scale(0.94);

                box-shadow:
                    0 0 35px rgba(59, 130, 246, 0.55),
                    0 0 70px rgba(37, 99, 235, 0.25);
            }

            to {
                transform: scale(1.08);

                box-shadow:
                    0 0 55px rgba(96, 165, 250, 0.85),
                    0 0 120px rgba(37, 99, 235, 0.45);
            }
        }

        .voice-waves {
            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 5px;

            pointer-events: none;
        }

        .voice-wave {
            width: 4px;
            height: 20px;

            border-radius: 10px;

            background: rgba(147, 197, 253, 0.8);

            opacity: 0.25;
        }

        .voice-ai.active .voice-wave {
            animation:
                wave 0.7s ease-in-out infinite alternate;
        }

        .voice-wave:nth-child(1) {
            transform: translateX(-105px);
            animation-delay: 0s;
        }

        .voice-wave:nth-child(2) {
            transform: translateX(-85px);
            animation-delay: 0.1s;
        }

        .voice-wave:nth-child(3) {
            transform: translateX(-65px);
            animation-delay: 0.2s;
        }

        .voice-wave:nth-child(4) {
            transform: translateX(65px);
            animation-delay: 0.2s;
        }

        .voice-wave:nth-child(5) {
            transform: translateX(85px);
            animation-delay: 0.1s;
        }

        .voice-wave:nth-child(6) {
            transform: translateX(105px);
            animation-delay: 0s;
        }

        @keyframes wave {
            from {
                height: 15px;
                opacity: 0.35;
            }

            to {
                height: 65px;
                opacity: 1;
            }
        }

        .voice-status {
            min-height: 25px;

            color: rgba(255, 255, 255, 0.85);

            font-size: 16px;

            margin-bottom: 28px;
        }

        .voice-start {
            min-width: 190px;

            height: 50px;

            padding: 0 25px;

            border-radius: 14px;

            background: #ffffff;

            color: #111827;

            cursor: pointer;

            font-size: 15px;

            font-weight: 600;

            transition:
                transform 0.15s ease,
                background 0.2s ease;
        }

        .voice-start:hover {
            background: #dbeafe;
        }

        .voice-start:active {
            transform: scale(0.96);
        }

        .voice-start.recording {
            background: #ef4444;

            color: #ffffff;
        }

        .voice-close {
            position: absolute;

            top: 20px;
            left: 20px;

            width: 40px;
            height: 40px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.1);

            border: 1px solid rgba(255, 255, 255, 0.12);

            color: #ffffff;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 22px;
        }

        .voice-close:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        /* =====================================================
           BACKGROUND
        ===================================================== */

        .background-info {
            font-size: 12px;

            color: var(--muted);

            margin-top: 4px;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 750px) {

            .sidebar {
                position: fixed;

                top: 0;
                right: -280px;
                bottom: 0;

                box-shadow:
                    -10px 0 30px rgba(0, 0, 0, 0.12);
            }

            .sidebar.open {
                right: 0;
            }

            .mobile-menu {
                display: flex;
            }

            .topbar {
                padding: 0 12px;
            }

            .chat {
                padding: 20px 12px;
            }

            .composer-area {
                padding: 10px;
            }

            .message-bubble {
                max-width: 92%;
            }

            .welcome h1 {
                font-size: 22px;
            }

            .model-subtitle {
                display: none;
            }

            .status {
                font-size: 12px;
            }

            .tool,
            .send-btn {
                width: 36px;
                height: 36px;
            }

            .message-action-label {
                display: none;
            }

            .voice-box {
                min-height: 90vh;

                padding: 30px 20px;
            }

            .voice-title {
                font-size: 24px;
            }

            .voice-ai {
                transform: scale(0.82);
            }

            .toast-container {
                right: 10px;
                left: 10px;
                bottom: 10px;
            }

            .toast {
                width: 100%;
                max-width: none;
            }
        }
    </style>
</head>

<body>

    <div class="app">

        <!-- =====================================================
             SIDEBAR
        ====================================================== -->

        <aside class="sidebar" id="sidebar">

            <div class="brand">

                <div class="brand-logo">
                    DA
                </div>

                <div>

                    <div class="brand-name">
                        Aido AI
                    </div>

                    <span class="brand-version">
                        AI Assistant
                    </span>

                </div>

            </div>

            <button
                class="new-chat"
                id="newChatBtn"
                type="button"
            >

                <span class="icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 5v14"></path>
                        <path d="M5 12h14"></path>
                    </svg>
                </span>

                <span>
                    محادثة جديدة
                </span>

            </button>

            <div class="sidebar-title">
                المحادثات
            </div>

            <!-- البحث في المحادثات -->
            <input
                type="search"
                class="history-search"
                id="historySearch"
                placeholder="ابحث في المحادثات..."
                aria-label="البحث في المحادثات"
                autocomplete="off"
            >

            <div
                class="history"
                id="history"
            ></div>

            <div class="sidebar-bottom">

                <button
                    class="side-btn"
                    id="exportBtn"
                    type="button"
                >

                    <span class="icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 3v12"></path>
                            <path d="M7 10l5 5 5-5"></path>
                            <path d="M5 21h14"></path>
                        </svg>
                    </span>

                    <span>
                        تصدير المحادثة
                    </span>

                </button>

                <button
                    class="side-btn"
                    id="copyChatBtn"
                    type="button"
                >

                    <span class="icon">
                        <svg viewBox="0 0 24 24">
                            <rect
                                x="8"
                                y="8"
                                width="11"
                                height="11"
                                rx="2"
                            ></rect>

                            <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path>
                        </svg>
                    </span>

                    <span>
                        نسخ المحادثة
                    </span>

                </button>

                <button
                    class="side-btn"
                    id="themeBtn"
                    type="button"
                >

                    <span class="icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3A6.7 6.7 0 0 0 21 12.8z"></path>
                        </svg>
                    </span>

                    <span id="themeText">
                        الوضع الليلي
                    </span>

                </button>

                <button
                    class="side-btn"
                    id="backgroundBtn"
                    type="button"
                >

                    <span class="icon">
                        <svg viewBox="0 0 24 24">
                            <rect
                                x="3"
                                y="4"
                                width="18"
                                height="16"
                                rx="2"
                            ></rect>

                            <circle
                                cx="8.5"
                                cy="9"
                                r="1.5"
                            ></circle>

                            <path d="M21 15l-5-5L5 20"></path>
                        </svg>
                    </span>

                    <span>
                        خلفية الجهاز
                    </span>

                </button>

                <button
                    class="side-btn"
                    id="clearBackgroundBtn"
                    type="button"
                >

                    <span class="icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M4 4l16 16"></path>
                            <path d="M20 4L4 20"></path>
                        </svg>
                    </span>

                    <span>
                        إزالة الخلفية
                    </span>

                </button>

                <button
                    class="side-btn"
                    id="clearBtn"
                    type="button"
                >

                    <span class="icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M3 6h18"></path>
                            <path d="M8 6V4h8v2"></path>
                            <path d="M19 6l-1 15H6L5 6"></path>
                            <path d="M10 11v6"></path>
                            <path d="M14 11v6"></path>
                        </svg>
                    </span>

                    <span>
                        مسح المحادثات
                    </span>

                </button>

            </div>

        </aside>

        <!-- =====================================================
             MAIN
        ====================================================== -->

        <main class="main">

            <header class="topbar">

                <div class="topbar-right">

                    <button
                        class="mobile-menu"
                        id="mobileMenu"
                        type="button"
                        title="القائمة"
                        aria-label="فتح القائمة"
                    >

                        <span class="icon">

                            <svg viewBox="0 0 24 24">
                                <path d="M4 6h16"></path>
                                <path d="M4 12h16"></path>
                                <path d="M4 18h16"></path>
                            </svg>

                        </span>

                    </button>

                    <div class="model-logo">
                        DA
                    </div>

                    <div>

                        <div class="model-name">
                            Aido AI
                        </div>

                        <div class="model-subtitle">
                            Gemini AI + OpenRouter + OpenAI
                        </div>

                    </div>

                </div>

                <div
                    class="status"
                    id="status"
                >

                    <span
                        class="status-dot"
                        id="statusDot"
                    ></span>

                    <span id="statusText">
                        متصل
                    </span>

                </div>

            </header>

            <!-- =================================================
                 CHAT
            ================================================== -->

            <section
                class="chat"
                id="chat"
            >

                <div
                    class="chat-inner"
                    id="chatInner"
                >

                    <div
                        class="welcome"
                        id="welcome"
                    >

                        <div class="welcome-logo">
                            DA
                        </div>

                        <h1>
                            مرحباً بك في Aido AI
                        </h1>

                        <p>
                            كيف يمكنني مساعدتك اليوم؟
                        </p>

                    </div>

                    <div
                        class="typing"
                        id="typing"
                    >

                        <span>
                            Aido AI يكتب
                        </span>

                        <span class="typing-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </span>

                    </div>

                </div>

            </section>

            <!-- =================================================
                 COMPOSER
            ================================================== -->

            <div class="composer-area">

                <form
                    class="composer"
                    id="chatForm"
                >

                    <div class="input-box">

                        <div
                            class="image-container"
                            id="imageContainer"
                        >

                            <img
                                id="previewImage"
                                src=""
                                alt="معاينة الصورة"
                            >

                            <button
                                type="button"
                                id="removeImage"
                                title="إزالة الصورة"
                                aria-label="إزالة الصورة"
                            >
                                ×
                            </button>

                        </div>

                        <input
                            type="file"
                            id="imageInput"
                            name="image"
                            accept="image/*"
                        >

                        <textarea
                            id="question"
                            name="question"
                            rows="1"
                            autocomplete="off"
                            placeholder="اكتب رسالتك هنا..."
                            aria-label="رسالتك"
                        ></textarea>

                        <div class="composer-meta">
                            <span id="characterCount">
                                0 / 4000
                            </span>
                        </div>

                        <div class="tools">

                            <!-- صورة -->
                            <button
                                type="button"
                                class="tool"
                                id="imageBtn"
                                title="إضافة صورة"
                                aria-label="إضافة صورة"
                            >

                                <svg viewBox="0 0 24 24">
                                    <rect
                                        x="3"
                                        y="4"
                                        width="18"
                                        height="16"
                                        rx="2"
                                    ></rect>

                                    <circle
                                        cx="8.5"
                                        cy="9"
                                        r="1.5"
                                    ></circle>

                                    <path d="M21 15l-5-5L5 20"></path>
                                </svg>

                            </button>

                            <!-- تحويل الكلام إلى نص -->
                            <button
                                type="button"
                                class="tool"
                                id="micBtn"
                                title="تحويل الكلام إلى نص"
                                aria-label="تحويل الكلام إلى نص"
                            >

                                <svg viewBox="0 0 24 24">
                                    <rect
                                        x="9"
                                        y="3"
                                        width="6"
                                        height="11"
                                        rx="3"
                                    ></rect>

                                    <path d="M5 11a7 7 0 0 0 14 0"></path>
                                    <path d="M12 18v3"></path>
                                    <path d="M8 21h8"></path>
                                </svg>

                            </button>

                            <!-- المحادثة الصوتية -->
                            <button
                                type="button"
                                class="tool"
                                id="voiceChatBtn"
                                title="المحادثة الصوتية"
                                aria-label="المحادثة الصوتية"
                            >

                                <svg viewBox="0 0 24 24">
                                    <path d="M12 2v20"></path>
                                    <path d="M5 9v6"></path>
                                    <path d="M19 9v6"></path>
                                    <path d="M8 6v12"></path>
                                    <path d="M16 6v12"></path>
                                </svg>

                            </button>

                            <!-- قراءة آخر إجابة -->
                            <button
                                type="button"
                                class="tool"
                                id="voiceBtn2"
                                title="قراءة آخر إجابة"
                                aria-label="قراءة آخر إجابة"
                            >

                                <svg viewBox="0 0 24 24">
                                    <path d="M11 5L6 9H3v6h3l5 4z"></path>
                                    <path d="M15 9a4 4 0 0 1 0 6"></path>
                                    <path d="M18 6a8 8 0 0 1 0 12"></path>
                                </svg>

                            </button>

                            <!-- إرسال -->
                            <button
                                type="submit"
                                class="send-btn"
                                id="sendBtn"
                                title="إرسال"
                                aria-label="إرسال"
                            >

                                <svg viewBox="0 0 24 24">
                                    <path d="M22 2L11 13"></path>
                                    <path d="M22 2l-7 20-4-9-9-4z"></path>
                                </svg>

                            </button>

                        </div>

                    </div>

                </form>

            </div>

        </main>

    </div>

    <!-- =========================================================
         BACKGROUND INPUT
    ========================================================== -->

    <input
        type="file"
        id="backgroundInput"
        accept="image/*"
    >

    <!-- =========================================================
         TOAST CONTAINER
    ========================================================== -->

    <div
        class="toast-container"
        id="toastContainer"
    ></div>

    <!-- =========================================================
         VOICE PANEL
    ========================================================== -->

        class="voice-panel"
        id="voicePanel"
    >

        <div class="voice-box">

            <button

                id="voiceClose"
                type="button"
                aria-label="إغلاق"
                title="إغلاق"
            >
                ×
            </button>

            <div class="voice-title">
                المحادثة الصوتية
            </div>

            <div class="voice-subtitle">
                تحدث مع Aido AI بالصوت
            </div>

            <div
                class="voice-ai"
                id="voiceAI"
            >

                <div class="voice-waves">

                    <span class="voice-wave"></span>
                    <span class="voice-wave"></span>
                    <span class="voice-wave"></span>
                    <span class="voice-wave"></span>
                    <span class="voice-wave"></span>
                    <span class="voice-wave"></span>

                </div>

                <div class="voice-core">
                    <span>
                        IA
                    </span>
                </div>

            </div>

            <div
                class="voice-status"
                id="voiceStatus"
            >
                اضغط لبدء المحادثة
            </div>

            <button
                class="voice-start"
                id="voiceStart"
                type="button"
            >
                بدء المحادثة
            </button>

        </div>

    </div>

    <!-- =========================================================
         SERVER ANSWER
    ========================================================== -->

    <div
        id="server-answer"
        style="display: none;"
    >
        {% if answer %}
            {{ answer }}
        {% endif %}
    </div>

    <script>
        "use strict";

        /* =========================================================
           ELEMENTS
        ========================================================= */

        const chatForm = document.getElementById("chatForm");
        const questionInput = document.getElementById("question");
        const chat = document.getElementById("chat");
        const chatInner = document.getElementById("chatInner");
        const welcome = document.getElementById("welcome");
        const typing = document.getElementById("typing");
        const sendBtn = document.getElementById("sendBtn");

        const imageBtn = document.getElementById("imageBtn");
        const imageInput = document.getElementById("imageInput");
        const imageContainer = document.getElementById("imageContainer");
        const previewImage = document.getElementById("previewImage");
        const removeImage = document.getElementById("removeImage");

        const newChatBtn = document.getElementById("newChatBtn");
        const themeBtn = document.getElementById("themeBtn");
        const themeText = document.getElementById("themeText");
        const clearBtn = document.getElementById("clearBtn");
        const history = document.getElementById("history");
        const historySearch = document.getElementById("historySearch");

        const exportBtn = document.getElementById("exportBtn");
        const copyChatBtn = document.getElementById("copyChatBtn");

        const backgroundBtn = document.getElementById("backgroundBtn");
        const backgroundInput = document.getElementById("backgroundInput");
        const clearBackgroundBtn =
            document.getElementById("clearBackgroundBtn");

        const mobileMenu = document.getElementById("mobileMenu");
        const sidebar = document.getElementById("sidebar");

        const micBtn = document.getElementById("micBtn");
        const voiceChatBtn = document.getElementById("voiceChatBtn");
        const voiceBtn2 = document.getElementById("voiceBtn2");

        const voicePanel = document.getElementById("voicePanel");
        const voiceStart = document.getElementById("voiceStart");
        const voiceClose = document.getElementById("voiceClose");
        const voiceStatus = document.getElementById("voiceStatus");
        const voiceAI = document.getElementById("voiceAI");

        const status = document.getElementById("status");
        const statusText = document.getElementById("statusText");
        const statusDot = document.getElementById("statusDot");

        const characterCount =
            document.getElementById("characterCount");

        const toastContainer =
            document.getElementById("toastContainer");


        /* =========================================================
           STATE
        ========================================================= */

        let selectedImage = null;
        let lastAnswer = "";

        let recognition = null;
        let speechAvailable = false;

        let isRecording = false;
        let voiceMode = false;

        let conversations = [];

        const MAX_MESSAGE_LENGTH = 4000;


        /* =========================================================
           STORAGE KEYS
        ========================================================= */

        const STORAGE_CONVERSATIONS = "aido_conversations";
        const STORAGE_THEME = "aido_theme";
        const STORAGE_BACKGROUND = "aido_background";


        /* =========================================================
           TOAST
        ========================================================= */

        function showToast(message) {

            if (!message) {
                return;
            }

            const toast =
                document.createElement("div");

            toast.className = "toast";

            toast.textContent = message;

            toastContainer.appendChild(toast);

            setTimeout(
                function () {

                    toast.remove();

                },
                3100
            );
        }


        /* =========================================================
           LOAD CONVERSATIONS
        ========================================================= */

        function loadConversations() {

            try {

                const saved =
                    localStorage.getItem(
                        STORAGE_CONVERSATIONS
                    );

                conversations =
                    saved
                        ? JSON.parse(saved)
                        : [];

                if (!Array.isArray(conversations)) {
                    conversations = [];
                }

            } catch (error) {

                console.error(
                    "Conversation load error:",
                    error
                );

                conversations = [];
            }
        }


        /* =========================================================
           SAVE CONVERSATIONS
        ========================================================= */

        function saveConversations() {

            try {

                localStorage.setItem(
                    STORAGE_CONVERSATIONS,
                    JSON.stringify(conversations)
                );

            } catch (error) {

                console.error(
                    "Conversation save error:",
                    error
                );

                showToast(
                    "تعذر حفظ المحادثة في المتصفح."
                );
            }
        }


        /* =========================================================
           THEME
        ========================================================= */

        function loadTheme() {

            try {

                const savedTheme =
                    localStorage.getItem(
                        STORAGE_THEME
                    );

                const dark =
                    savedTheme === "dark";

                document.body.classList.toggle(
                    "dark",
                    dark
                );

                themeText.textContent =
                    dark
                        ? "الوضع النهاري"
                        : "الوضع الليلي";

            } catch (error) {

                console.error(
                    "Theme load error:",
                    error
                );
            }
        }


        themeBtn.addEventListener(
            "click",
            function () {

                const dark =
                    document.body.classList.toggle(
                        "dark"
                    );

                try {

                    localStorage.setItem(
                        STORAGE_THEME,
                        dark
                            ? "dark"
                            : "light"
                    );

                } catch (error) {

                    console.error(
                        "Theme save error:",
                        error
                    );
                }

                themeText.textContent =
                    dark
                        ? "الوضع النهاري"
                        : "الوضع الليلي";

                showToast(
                    dark
                        ? "تم تفعيل الوضع الليلي."
                        : "تم تفعيل الوضع النهاري."
                );
            }
        );


        /* =========================================================
           BACKGROUND
        ========================================================= */

        function loadBackground() {

            try {

                const saved =
                    localStorage.getItem(
                        STORAGE_BACKGROUND
                    );

                if (!saved) {
                    return;
                }

                document.documentElement.style.setProperty(
                    "--custom-background",
                    `url("${saved}")`
                );

                document.body.classList.add(
                    "has-background"
                );

            } catch (error) {

                console.error(
                    "Background load error:",
                    error
                );
            }
        }


        backgroundBtn.addEventListener(
            "click",
            function () {

                backgroundInput.click();
            }
        );


        backgroundInput.addEventListener(
            "change",
            function () {

                const file =
                    backgroundInput.files &&
                    backgroundInput.files[0];

                if (!file) {
                    return;
                }

                if (!file.type.startsWith("image/")) {

                    showToast(
                        "الملف المختار ليس صورة."
                    );

                    backgroundInput.value = "";

                    return;
                }

                const reader =
                    new FileReader();

                reader.onload =
                    function (event) {

                        const imageData =
                            event.target.result;

                        document.documentElement.style.setProperty(
                            "--custom-background",
                            `url("${imageData}")`
                        );

                        document.body.classList.add(
                            "has-background"
                        );

                        try {

                            localStorage.setItem(
                                STORAGE_BACKGROUND,
                                imageData
                            );

                            showToast(
                                "تم تغيير الخلفية."
                            );

                        } catch (error) {

                            console.error(
                                "Background save error:",
                                error
                            );

                            showToast(
                                "الصورة كبيرة جدًا ولا يمكن حفظها."
                            );
                        }
                    };

                reader.readAsDataURL(file);
            }
        );


        clearBackgroundBtn.addEventListener(
            "click",
            function () {

                document.documentElement.style.setProperty(
                    "--custom-background",
                    "none"
                );

                document.body.classList.remove(
                    "has-background"
                );

                try {

                    localStorage.removeItem(
                        STORAGE_BACKGROUND
                    );

                    showToast(
                        "تمت إزالة الخلفية."
                    );

                } catch (error) {

                    console.error(
                        "Background clear error:",
                        error
                    );
                }
            }
        );


        /* =========================================================
           MOBILE MENU
        ========================================================= */

        mobileMenu.addEventListener(
            "click",
            function () {

                sidebar.classList.toggle("open");
            }
        );


        /* =========================================================
           IMAGE
        ========================================================= */

        imageBtn.addEventListener(
            "click",
            function () {

                imageInput.click();
            }
        );


        imageInput.addEventListener(
            "change",
            function () {

                const file =
                    imageInput.files &&
                    imageInput.files[0];

                if (!file) {
                    return;
                }

                if (!file.type.startsWith("image/")) {

                    showToast(
                        "الملف المختار ليس صورة."
                    );

                    imageInput.value = "";
                    selectedImage = null;

                    return;
                }

                selectedImage = file;

                const reader =
                    new FileReader();

                reader.onload =
                    function (event) {

                        previewImage.src =
                            event.target.result;

                        imageContainer.classList.add(
                            "show"
                        );

                        showToast(
                            "تم اختيار الصورة."
                        );
                    };

                reader.onerror =
                    function () {

                        showToast(
                            "تعذر قراءة الصورة."
                        );

                        selectedImage = null;
                        imageInput.value = "";
                    };

                reader.readAsDataURL(file);
            }
        );


        removeImage.addEventListener(
            "click",
            function () {

                selectedImage = null;

                imageInput.value = "";

                previewImage.src = "";

                imageContainer.classList.remove(
                    "show"
                );
            }
        );


        /* =========================================================
           TEXTAREA
        ========================================================= */

        function resizeTextarea() {

            questionInput.style.height = "auto";

            const height =
                Math.min(
                    questionInput.scrollHeight,
                    150
                );

            questionInput.style.height =
                height + "px";
        }


        function updateCharacterCount() {

            const length =
                questionInput.value.length;

            characterCount.textContent =
                `${length} / ${MAX_MESSAGE_LENGTH}`;

            if (length >= MAX_MESSAGE_LENGTH) {

                characterCount.style.color =
                    "var(--danger)";

            } else {

                characterCount.style.color =
                    "var(--muted)";
            }
        }


        questionInput.addEventListener(
            "input",
            function () {

                if (
                    questionInput.value.length >
                    MAX_MESSAGE_LENGTH
                ) {

                    questionInput.value =
                        questionInput.value.slice(
                            0,
                            MAX_MESSAGE_LENGTH
                        );
                }

                resizeTextarea();

                updateCharacterCount();
            }
        );


        /* =========================================================
           ENTER TO SEND
        ========================================================= */

        questionInput.addEventListener(
            "keydown",
            function (event) {

        /* =========================================================
           COPY
        ========================================================= */

        async function copyText(text) {

            if (!text) {
                return;
            }

            try {

                if (
                    navigator.clipboard &&
                    window.isSecureContext
                ) {

                    await navigator.clipboard.writeText(
                        text
                    );

                } else {

                    const textarea =
                        document.createElement("textarea");

                    textarea.value = text;

                    textarea.style.position =
                        "fixed";

                    textarea.style.opacity =
                        "0";

                    document.body.appendChild(
                        textarea
                    );

                    textarea.select();

                    document.execCommand(
                        "copy"
                    );

                    textarea.remove();
                }

                showToast(
                    "تم نسخ الإجابة."
                );

            } catch (error) {

                console.error(
                    "Copy error:",
                    error
                );

                showToast(
                    "تعذر نسخ الإجابة."
                );
            }
        }


        /* =========================================================
           COPY CURRENT CHAT
        ========================================================= */

        async function copyCurrentChat() {

            const messages =
                chatInner.querySelectorAll(
                    ".message"
                );

            if (!messages.length) {

                showToast(
                    "لا توجد محادثة لنسخها."
                );

                return;
            }

            const parts = [];

            messages.forEach(
                function (message) {

                    const label =
                        message.querySelector(
                            ".message-label"
                        );

                    const bubble =
                        message.querySelector(
                            ".message-bubble"
                        );

                    if (
                        label &&
                        bubble &&
                        bubble.textContent.trim()
                    ) {

                        parts.push(
                            label.textContent.trim() +
                            ":\n" +
                            bubble.textContent.trim()
                        );
                    }
                }
            );

            const text =
                parts.join("\n\n");

            await copyText(text);
        }


        copyChatBtn.addEventListener(
            "click",
            copyCurrentChat
        );

           EXPORT CURRENT CHAT
        ========================================================= */

        function exportCurrentChat() {

            const messages =
                chatInner.querySelectorAll(
                    ".message"
                );

            if (!messages.length) {

                showToast(
                    "لا توجد محادثة لتصديرها."
                );

                return;
            }

            const parts = [];

            messages.forEach(
                function (message) {

                    const label =
                        message.querySelector(
                            ".message-label"
                        );

                    const bubble =
                        message.querySelector(
                            ".message-bubble"
                        );

                    if (
                        label &&
                        bubble &&
                        bubble.textContent.trim()
                    ) {

                        parts.push(
                            label.textContent.trim() +
                            ":\n" +
                            bubble.textContent.trim()
                        );
                    }
                }
            );

            const content =
                "Aido AI\n" +
                "====================\n\n" +

                "\n\n====================\n" +

                "aido-ai-conversation.txt";

            document.body.appendChild(link);

            link.click();

            link.remove();

            setTimeout(

        /* =========================================================
           TEXT TO SPEECH
        ========================================================= */

        function speakText(text) {

            if (!text) {
                return;
            }

            if (
                !("speechSynthesis" in window)
            ) {

                showToast(
                    "المتصفح لا يدعم قراءة النص صوتيًا."
                );

                return;
            }

            window.speechSynthesis.cancel();

            const utterance =
                new SpeechSynthesisUtterance(
                    text
                );

            utterance.lang = "ar-SA";
            utterance.rate = 0.95;
            utterance.pitch = 1;

            utterance.onstart =
                function () {

                    voiceAI.classList.add(
                        "active"
                    );
                };

            utterance.onend =
                function () {

                    voiceAI.classList.remove(
                        "active"
                    );
                };

            utterance.onerror =
                function () {

                    voiceAI.classList.remove(
                        "active"
                    );
                };

            window.speechSynthesis.speak(
                utterance
            );
        }

        /* =========================================================
           SAVE CONVERSATION
        ========================================================= */

        function saveConversation(
            question,
            answer
        ) {

            if (!question || !answer) {
                return;
            }

            conversations.unshift({

                question: question,

                answer: answer,

                date:
                    new Date().toISOString()
            });

            if (conversations.length > 30) {

                conversations =
                    conversations.slice(
                        0,
                        30
                    );
            }

            saveConversations();

            renderHistory();
        }


        /* =========================================================
           FORMAT DATE
        ========================================================= */

        function formatConversationDate(date) {

            if (!date) {
                return "";
            }

            try {

                return new Date(
                    date
                ).toLocaleString(
                    "ar-MA",
                    {
                        day: "2-digit",
                        month: "2-digit",
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );

            } catch (error) {

                return "";
            }
        }


        /* =========================================================
           DELETE ONE HISTORY ITEM
        ========================================================= */

        function deleteConversation(index) {

            if (
                index < 0 ||
                index >= conversations.length
            ) {

                return;
            }

            conversations.splice(
                index,
                1
            );

            saveConversations();

            renderHistory();

            showToast(
                "تم حذف المحادثة."
            );
        }


        /* =========================================================
           HISTORY
        ========================================================= */

        function renderHistory() {

            history.innerHTML = "";

            const search =
                historySearch
                    ? historySearch.value
                        .trim()
                        .toLowerCase()
                    : "";

            const filtered =
                conversations
                    .map(
                        function (
                            conversation,
                            index
                        ) {

                            return {
                                conversation,
                                index
                            };
                        }
                    )
                    .filter(
                        function (item) {

                            if (!search) {
                                return true;
                            }

                            return (
                                (
                                    item.conversation.question ||
                                    ""
                                )
                                .toLowerCase()
                                .includes(search)
                            );
                        }
                    );

            if (filtered.length === 0) {

                const empty =
                    document.createElement("div");

                empty.className =
                    "history-empty";

                empty.textContent =
                    search
                        ? "لا توجد نتائج."
                        : "لا توجد محادثات محفوظة";

                history.appendChild(empty);

                return;
            }

            filtered.forEach(
                function (item) {

                    const conversation =
                        item.conversation;

                    const index =
                        item.index;

                    const historyItem =
                        document.createElement("div");

                    historyItem.className =
                        "history-item";

                    const title =
                        document.createElement("div");

                    title.className =
                        "history-item-title";

                    title.textContent =
                        conversation.question ||
                        "محادثة";

                    const date =
                        document.createElement("div");

                    date.className =
                        "history-item-date";

                    date.textContent =
                        formatConversationDate(
                            conversation.date
                        );

                    const deleteButton =
                        document.createElement("button");

                    deleteButton.className =
                        "history-delete";

                    deleteButton.type =
                        "button";

                    deleteButton.title =
                        "حذف المحادثة";

                    deleteButton.innerHTML = `
                        <svg viewBox="0 0 24 24">
                            <path d="M3 6h18"></path>
                            <path d="M8 6V4h8v2"></path>
                            <path d="M19 6l-1 15H6L5 6"></path>
                        </svg>
                    `;

                    deleteButton.addEventListener(
                        "click",
                        function (event) {

                            event.stopPropagation();

                            deleteConversation(
                                index
                            );
                        }
                    );

                    historyItem.appendChild(title);
                    historyItem.appendChild(date);
                    historyItem.appendChild(deleteButton);

                    historyItem.addEventListener(
                        "click",
                        function () {

                            loadConversation(index);

                            sidebar.classList.remove(
                                "open"
                            );
                        }
                    );

                    history.appendChild(
                        historyItem
                    );
                }
            );
        }


        /* =========================================================
           HISTORY SEARCH
        ========================================================= */

        historySearch.addEventListener(

            function () {

                renderHistory();
            }
        );
