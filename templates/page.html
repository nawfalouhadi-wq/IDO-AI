        /* =========================================================
           READ SERVER RESPONSE
        ========================================================= */

        async function extractServerAnswer(
            response
        ) {

            const html =
                await response.text();

            const parser =
                new DOMParser();

            const documentData =
                parser.parseFromString(
                    html,
                    "text/html"
                );

            const answerElement =
                documentData.querySelector(
                    "#server-answer"
                );

            if (!answerElement) {

                return "";
            }

            return (
                answerElement.textContent || ""
            ).trim();
        }


        /* =========================================================
           SEND MESSAGE
        ========================================================= */

        chatForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                if (sendBtn.disabled) {
                    return;
                }

                const question =
                    questionInput.value.trim();

                if (
                    !question &&
                    !selectedImage
                ) {

                    questionInput.focus();

                    return;
                }

                const imageFile =
                    selectedImage;

                let imagePreview = null;

                if (imageFile) {

                    imagePreview =
                        URL.createObjectURL(
                            imageFile
                        );
                }

                addMessage(
                    question ||
                    "حلل هذه الصورة من فضلك.",
                    "user",
                    imagePreview
                );

                questionInput.value = "";

                resizeTextarea();

                updateCharacterCount();

                removeImage.click();

                setTyping(true);

                sendBtn.disabled = true;

                setOnlineStatus(true);

                try {

                    let answer = "";


                    /* ============================================
                       IMAGE REQUEST
                    ============================================ */

                    if (imageFile) {

                        const formData =
                            new FormData();

                        formData.append(
                            "question",
                            question ||
                            "حلل هذه الصورة واشرح لي ما الذي يظهر فيها."
                        );

                        formData.append(
                            "image",
                            imageFile
                        );

                        const response =
                            await fetch(
                                "/",
                                {
                                    method: "POST",
                                    body: formData
                                }
                            );

                        if (!response.ok) {

                            throw new Error(
                                "HTTP " +
                                response.status
                            );
                        }

                        answer =
                            await extractServerAnswer(
                                response
                            );

                        if (!answer) {

                            answer =
                                "تم إرسال الصورة، ولكن تعذر الحصول على نتيجة التحليل.";
                        }
                    }


                    /* ============================================
                       TEXT REQUEST
                    ============================================ */

                    else {

                        const response =
                            await fetch(
                                "/api/chat",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            message:
                                                question
                                        })
                                }
                            );

                        if (!response.ok) {

                            throw new Error(
                                "HTTP " +
                                response.status
                            );
                        }

                        const data =
                            await response.json();

                        answer =
                            data.answer ||
                            data.response ||
                            data.message ||
                            "";
                    }


                    /* ============================================
                       FINAL ANSWER
                    ============================================ */

                    if (
                        typeof answer !== "string"
                    ) {

                        answer =
                            String(answer);
                    }

                    answer =
                        answer.trim();

                    if (!answer) {

                        answer =
                            "أنا Aido AI ولم أجد إجابة حاليًا.";
                    }

                    lastAnswer =
                        answer;

                    setTyping(false);

                    addMessage(
                        answer,
                        "ai"
                    );

                    saveConversation(
                        question ||
                        "تحليل صورة",
                        answer
                    );

                    setOnlineStatus(true);

                } catch (error) {

                    console.error(
                        "AIDO AI ERROR:",
                        error
                    );

                    setTyping(false);

                    setOnlineStatus(false);

                    const errorMessage =
                        "حدث خطأ أثناء الاتصال بـ Aido AI. تأكد من أن الخادم يعمل ثم حاول مرة أخرى.";

                    lastAnswer =
                        errorMessage;

                    addMessage(
                        errorMessage,
                        "ai"
                    );

                } finally {

                    sendBtn.disabled = false;

                    if (imagePreview) {

                        setTimeout(
                            function () {

                                URL.revokeObjectURL(
                                    imagePreview
                                );

                            },
                            1000
                        );
                    }
                }
            }
        );


        /* =========================================================
           SPEECH RECOGNITION
        ========================================================= */

        function setupSpeechRecognition() {

            const SpeechRecognition =
                window.SpeechRecognition ||
                window.webkitSpeechRecognition;

            if (!SpeechRecognition) {

                return false;
            }

            try {

                recognition =
                    new SpeechRecognition();

                recognition.lang =
                    "ar-MA";

                recognition.continuous =
                    false;

                recognition.interimResults =
                    true;

                recognition.onstart =
                    function () {

                        isRecording = true;

                        micBtn.classList.add(
                            "active"
                        );

                        if (voiceMode) {

                            voiceAI.classList.add(
                                "active"
                            );

                            voiceStatus.textContent =
                                "أستمع إليك الآن...";
                        }
                    };


                recognition.onresult =
                    function (event) {

                        let transcript = "";

                        for (
                            let i = event.resultIndex;
                            i < event.results.length;
                            i++
                        ) {

                            transcript +=
                                event.results[i][0]
                                    .transcript;
                        }

                        questionInput.value =
                            transcript;

                        resizeTextarea();

                        updateCharacterCount();
                    };


                recognition.onerror =
                    function (event) {

                        console.error(
                            "Speech error:",
                            event.error
                        );

                        isRecording = false;

                        micBtn.classList.remove(
                            "active"
                        );

                        voiceAI.classList.remove(
                            "active"
                        );

                        if (voiceMode) {

                            voiceStatus.textContent =
                                "حدث خطأ أثناء الاستماع.";
                        }
                    };


                recognition.onend =
                    function () {

                        isRecording = false;

                        micBtn.classList.remove(
                            "active"
                        );

                        voiceAI.classList.remove(
                            "active"
                        );

                        if (voiceMode) {

                            voiceMode = false;

                            voiceStart.classList.remove(
                                "recording"
                            );

                            voiceStart.textContent =
                                "بدء المحادثة";

                            voiceStatus.textContent =
                                "تم التقاط الكلام.";

                            if (
                                questionInput.value.trim()
                            ) {

                                chatForm.requestSubmit();
                            }
                        }
                    };


                return true;

            } catch (error) {

                console.error(
                    "Speech setup error:",
                    error
                );

                recognition = null;

                return false;
            }
        }


        speechAvailable =
            setupSpeechRecognition();


        /* =========================================================
           MICROPHONE
        ========================================================= */

        micBtn.addEventListener(
            "click",
            function () {

                if (!speechAvailable) {

                    showToast(
                        "المتصفح لا يدعم تحويل الكلام إلى نص."
                    );

                    return;
                }

                if (!recognition) {
                    return;
                }

                if (isRecording) {

                    recognition.stop();

                } else {

                    try {

                        recognition.start();

                    } catch (error) {

                        console.error(
                            "Recognition start error:",
                            error
                        );
                    }
                }
            }
        );

           VOICE PANEL

        /* =========================================================
           START VOICE CHAT
        ========================================================= */

        voiceStart.addEventListener(
            "click",
            function () {

                if (!speechAvailable) {

                    showToast(
                        "المتصفح لا يدعم المحادثة الصوتية."
                    );

                    return;
                }

                if (!recognition) {
                    return;
                }

                if (isRecording) {

                    stopVoiceChat();

                    return;

                voiceMode = true;

                questionInput.value = "";

                resizeTextarea();

                updateCharacterCount();

                voiceStart.classList.add(
                    "recording"
                );

                voiceStart.textContent =
                    "إيقاف المحادثة";

                voiceStatus.textContent =
                    "أستمع إليك الآن...";

                voiceAI.classList.add(
                    "active"
                );

                try {

                    recognition.start();

                } catch (error) {

                    console.error(
                        "Voice start error:",
                        error
                    );

                    voiceMode = false;

                    voiceAI.classList.remove(
                        "active"
                    );

                    voiceStart.classList.remove(
                        "recording"
                    );

                    voiceStart.textContent =
                        "بدء المحادثة";

                    voiceStatus.textContent =
                        "تعذر بدء المحادثة الصوتية.";
                }
            }
        );


        /* =========================================================
           STOP VOICE CHAT
        ========================================================= */

        function stopVoiceChat() {

            voiceMode = false;

            isRecording = false;

            voiceAI.classList.remove(
                "active"
            );

            if (recognition) {

                try {

                    recognition.stop();

                } catch (error) {

                    console.debug(
                        "Recognition already stopped."
                    );
                }
            }

            micBtn.classList.remove(
                "active"
            );

            voiceStart.classList.remove(
                "recording"
            );

            voiceStart.textContent =
                "بدء المحادثة";

            voiceStatus.textContent =
                "اضغط لبدء المحادثة";
        }


        /* =========================================================
           KEYBOARD SHORTCUTS
        ========================================================= */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    (event.ctrlKey || event.metaKey) &&
                    event.key.toLowerCase() === "k"
                ) {

                    event.preventDefault();

                    questionInput.focus();

                    return;
                }

                if (
                    (event.ctrlKey || event.metaKey) &&
                    event.key.toLowerCase() === "n"
                ) {

                    event.preventDefault();

                    clearChat(true);

                    questionInput.value = "";

                    resizeTextarea();

                    updateCharacterCount();

                    questionInput.focus();

                    return;
                }

                if (event.key === "Escape") {

                    stopVoiceChat();

                    voicePanel.classList.remove(
                        "show"
                    );

                    sidebar.classList.remove(
                        "open"
                    );
                }
            }
        );


        /* =========================================================
           INITIALIZATION
        ========================================================= */

        loadConversations();

        loadTheme();

        loadBackground();

        renderHistory();

        resizeTextarea();

        updateCharacterCount();

        setOnlineStatus(true);
    </script>

</body>

</html>
