<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Aido AI - مساعد الذكاء الاصطناعي">
    <meta name="theme-color" content="#2563eb">
    <title>Aido AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-soft: rgba(37, 99, 235, .10);
            --background: #f5f7fb;
            --surface: #ffffff;
            --surface-2: #f1f5f9;
            --surface-3: #e8eef7;
            --border: #e5e7eb;
            --text: #1f2937;
            --muted: #6b7280;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --shadow: 0 4px 20px rgba(0, 0, 0, .06);
            --shadow-lg: 0 15px 50px rgba(0, 0, 0, .12);
            --radius: 12px;
            --custom-background: none;
            --sidebar-width: 270px;
            --topbar-height: 70px;
        }
        body.dark {
            --background: #111827;
            --surface: #1f2937;
            --surface-2: #374151;
            --surface-3: #435066;
            --border: #4b5563;
            --text: #f9fafb;
            --muted: #9ca3af;
            --shadow: 0 4px 20px rgba(0, 0, 0, .25);
            --shadow-lg: 0 15px 50px rgba(0, 0, 0, .35);
        }
        html,
        body {
            width: 100%;
            height: 100%;
        }
        html {
            background: var(--background);
        }
        body {
            font-family:
                Arial,
                Tahoma,
                "Segoe UI",
                sans-serif;
            background:
                var(--custom-background),
                var(--background);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text);
            overflow: hidden;
            transition:
                background .2s ease,
                color .2s ease;
        }
        body.has-background::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, .72);
            z-index: -1;
            pointer-events: none;
        }
        body.dark.has-background::before {
            background: rgba(0, 0, 0, .58);
        }
        button,
        textarea,
        input {
            font-family: inherit;
        }
        button {
            border: none;
        }
        button:focus-visible,
        textarea:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
        button,
        .history-item {
            -webkit-tap-highlight-color: transparent;
        }
        /* =====================================================
           APP
        ===================================================== */
        .app {
            width: 100%;
            height: 100dvh;
            min-height: 0;
            display: flex;
            position: relative;
        }
        /* =====================================================
           SIDEBAR
        ===================================================== */
        .sidebar {
            width: var(--sidebar-width);
            height: 100%;
            flex-shrink: 0;
            background: rgba(255, 255, 255, .94);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 18px;
            z-index: 900;
            transition:
                right .25s ease,
                transform .25s ease;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }
        body.dark .sidebar {
            background: rgba(31, 41, 55, .95);
        }
        .sidebar-mobile-header {
            display: none;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }
        .brand-logo,
        .model-logo,
        .welcome-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #3b82f6
                );
            color: #ffffff;
            font-weight: bold;
            flex-shrink: 0;
        }
        .brand-logo {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            box-shadow:
                0 8px 22px rgba(37, 99, 235, .18);
        }
        .brand-name {
            font-size: 19px;
            font-weight: bold;
        }
        .brand-version {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 12px;
        }
        .new-chat,
        .side-btn {
            width: 100%;
            min-height: 44px;
            padding: 11px 12px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
            background: transparent;
            font-size: 14px;
            text-align: right;
            transition:
                background .2s ease,
                transform .1s ease;
        }
        .new-chat {
            justify-content: center;
            background: var(--primary);
            color: #ffffff;
            margin-bottom: 14px;
            box-shadow:
                0 6px 18px rgba(37, 99, 235, .18);
        }
        .new-chat:hover {
            background: var(--primary-hover);
        }
        .side-btn:hover {
            background: var(--surface-2);
        }
        .new-chat:active,
        .side-btn:active,
        .tool:active,
        .send-btn:active,
        .message-action:active {
            transform: scale(.97);
        }
        .icon {
            width: 20px;
            height: 20px;
            display: inline-flex;
            flex-shrink: 0;
        }
        svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .sidebar-title {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 8px;
        }
        /* =====================================================
           HISTORY
        ===================================================== */
        .history-search-wrap {
            position: relative;
            margin-bottom: 10px;
        }
        .history-search-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--muted);
            pointer-events: none;
        }
        .history-search {
            width: 100%;
            height: 38px;
            padding:
                0 34px
                0 11px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--surface);
            color: var(--text);
            font-size: 13px;
            outline: none;
        }
        .history-search:focus {
            border-color: var(--primary);
        }
        .history {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding-left: 2px;
            scrollbar-width: thin;
        }
        .history-item {
            position: relative;
            padding: 10px 34px 10px 10px;
            margin-bottom: 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            transition:
                background .2s ease,
                transform .1s ease;
        }
        .history-item:hover {
            background: var(--surface-2);
        }
        .history-item:active {
            transform: scale(.99);
        }
        .history-item-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .history-item-date {
            color: var(--muted);
            font-size: 10px;
            margin-top: 3px;
        }
        .history-delete {
            position: absolute;
            left: 7px;
            top: 50%;
            transform: translateY(-50%);
            width: 25px;
            height: 25px;
            border-radius: 7px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            opacity: 0;
            transition:
                opacity .2s ease,
                background .2s ease,
                color .2s ease;
        }
        .history-item:hover .history-delete {
            opacity: 1;
        }
        .history-delete:hover {
            background: rgba(239, 68, 68, .12);
            color: var(--danger);
        }
        .history-empty {
            color: var(--muted);
            font-size: 13px;
            text-align: center;
            padding: 20px 10px;
        }
        .sidebar-bottom {
            border-top: 1px solid var(--border);
            padding-top: 12px;
            margin-top: 8px;
        }
        /* =====================================================
           MOBILE OVERLAY
        ===================================================== */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .35);
            z-index: 850;
            opacity: 0;
            transition: opacity .2s ease;
            backdrop-filter: blur(2px);
        }
        /* =====================================================
           MAIN
        ===================================================== */
        .main {
            flex: 1;
            min-width: 0;
            min-height: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        /* =====================================================
           TOPBAR
        ===================================================== */
        .topbar {
            height: var(--topbar-height);
            flex-shrink: 0;
            padding: 0 22px;
            background: rgba(255, 255, 255, .94);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            z-index: 100;
        }
        body.dark .topbar {
            background: rgba(31, 41, 55, .94);
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .model-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
        }
        .model-info {
            min-width: 0;
        }
        .model-name {
            font-weight: bold;
        }
        .model-subtitle {
            color: var(--muted);
            font-size: 12px;
            margin-top: 2px;
            white-space: nowrap;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #16a34a;
            font-size: 13px;
            transition: color .2s ease;
        }
        .status.offline {
            color: var(--danger);
        }
        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--success);
            box-shadow:
                0 0 0 3px rgba(34, 197, 94, .12);
        }
        .status-dot.offline {
            background: var(--danger);
            box-shadow:
                0 0 0 3px rgba(239, 68, 68, .12);
        }
        .mobile-menu {
            display: none;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        .mobile-menu:hover {
            background: var(--surface-2);
        }
        /* =====================================================
           CHAT
        ===================================================== */
        .chat {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 35px 20px;
            scroll-behavior: smooth;
            overscroll-behavior: contain;
            scrollbar-width: thin;
        }
        .chat-inner {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            padding-bottom: 8px;
        }
        .welcome {
            min-height: 55vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px 10px;
        }
        .welcome.hidden {
            display: none;
        }
        .welcome-logo {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            font-size: 23px;
            margin-bottom: 20px;
            box-shadow:
                0 10px 30px rgba(37, 99, 235, .18);
        }
        .welcome h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .welcome p {
            color: var(--muted);
        }
        .welcome-suggestions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 25px;
            max-width: 650px;
        }
        .suggestion {
            padding: 9px 13px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            font-size: 12px;
            transition:
                background .2s ease,
                border-color .2s ease,
                transform .1s ease;
        }
        .suggestion:hover {
            background: var(--surface-2);
            border-color: var(--primary);
        }
        .suggestion:active {
            transform: scale(.97);
        }
        /* =====================================================
           MESSAGES
        ===================================================== */
        .message {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 22px;
            animation:
                messageAppear .2s ease;
        }
        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .message-user {
            align-items: flex-start;
        }
        .message-ai {
            align-items: flex-end;
        }
        .message-label {
            color: var(--muted);
            font-size: 12px;
            padding: 0 5px;
        }
        .message-bubble {
            max-width: 82%;
            padding: 13px 16px;
            border-radius: 16px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
        }
        .message-user .message-bubble {
            background: var(--primary);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }
        .message-ai .message-bubble {
            background: rgba(255, 255, 255, .94);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        body.dark .message-ai .message-bubble {
            background: rgba(31, 41, 55, .94);
        }
        /* Markdown-like formatting */
        .message-bubble p {
            margin-bottom: 9px;
        }
        .message-bubble p:last-child {
            margin-bottom: 0;
        }
        .message-bubble strong {
            font-weight: 700;
        }
        .message-bubble code {
            direction: ltr;
            display: inline-block;
            padding: 2px 6px;
            border-radius: 5px;
            background: var(--surface-2);
            font-family:
                Consolas,
                "Courier New",
                monospace;
            font-size: .9em;
        }
        .message-bubble pre {
            direction: ltr;
            text-align: left;
            white-space: pre;
            overflow-x: auto;
            margin-top: 10px;
            padding: 13px;
            border-radius: 10px;
            background: #111827;
            color: #f9fafb;
            font-family:
                Consolas,
                "Courier New",
                monospace;
            font-size: 13px;
            line-height: 1.5;
            position: relative;
        }
        .code-copy {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 30px;
            height: 30px;
            border-radius: 7px;
            background: rgba(255, 255, 255, .1);
            color: #ffffff;
            cursor: pointer;
        }
        .code-copy:hover {
            background: rgba(255, 255, 255, .2);
        }
        .message-image {
            max-width: 300px;
            max-height: 300px;
            border-radius: 12px;
            object-fit: contain;
            margin-top: 8px;
            border: 1px solid var(--border);
        }
        /* =====================================================
           MESSAGE ACTIONS
        ===================================================== */
        .message-actions {
            display: flex;
            gap: 7px;
            margin-top: 4px;
        }
        .message-action {
            min-width: 38px;
            height: 36px;
            padding: 0 10px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition:
                background .2s ease,
                transform .1s ease,
                border-color .2s ease;
        }
        .message-action:hover {
            background: var(--surface-2);
            border-color: var(--primary);
        }
        .message-action.stop-reading {
            color: var(--danger);
        }
        .message-action.stop-reading:hover {
            border-color: var(--danger);
            background: rgba(239, 68, 68, .08);
        }
        .message-action .icon {
            width: 17px;
            height: 17px;
        }
        .message-action-label {
            font-size: 12px;
        }
        /* =====================================================
           TYPING
        ===================================================== */
        .typing {
            display: none;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            margin-bottom: 20px;
            padding: 0 5px;
        }
        .typing.show {
            display: flex;
        }
        .typing-dots {
            display: inline-flex;
            gap: 4px;
        }
        .typing-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--muted);
            animation: typing 1s infinite;
        }
        .typing-dots span:nth-child(2) {
            animation-delay: .15s;
        }
        .typing-dots span:nth-child(3) {
            animation-delay: .3s;
        }
        @keyframes typing {
            0%,
            60%,
            100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-5px);
            }
        }
        /* =====================================================
           COMPOSER
        ===================================================== */
        .composer-area {
            flex-shrink: 0;
            padding: 15px 20px 20px;
            padding-bottom:
                max(20px, env(safe-area-inset-bottom));
        }
        .composer {
            max-width: 850px;
            margin: 0 auto;
        }
        .input-box {
            background: rgba(255, 255, 255, .94);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 12px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }
        body.dark .input-box {
            background: rgba(31, 41, 55, .94);
        }
        textarea {
            width: 100%;
            min-height: 45px;
            max-height: 150px;
            padding: 8px;
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            color: var(--text);
            font-size: 15px;
            line-height: 1.6;
            overflow-y: auto;
        }
        textarea::placeholder {
            color: var(--muted);
        }
        .composer-meta {
            display: flex;
            justify-content: flex-start;
            padding: 0 7px 5px;
            color: var(--muted);
            font-size: 10px;
        }
        .tools {
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .tool,
        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition:
                background .2s ease,
                transform .1s ease,
                opacity .2s ease;
        }
        .tool {
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid transparent;
        }
        .tool:hover {
            background: var(--border);
            border-color: var(--primary);
        }
        .tool.active {
            background: var(--danger);
            color: #ffffff;
        }
        .send-btn {
            margin-right: auto;
            background: var(--primary);
            color: #ffffff;
        }
        .send-btn:hover {
            background: var(--primary-hover);
        }
        .send-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }
        .stop-request-btn {
            display: none;
            background: var(--danger);
            color: #ffffff;
        }
        .stop-request-btn.show {
            display: flex;
        }
        /* =====================================================
           IMAGE
        ===================================================== */
        #imageInput,
        #backgroundInput {
            display: none;
        }
        .image-container {
            display: none;
            position: relative;
            width: fit-content;
            margin-bottom: 10px;
        }
        .image-container.show {
            display: block;
        }
        #previewImage {
            max-width: 150px;
            max-height: 120px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid var(--border);
        }
        #removeImage {
            position: absolute;
            top: -8px;
            left: -8px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--danger);
            color: #ffffff;
            cursor: pointer;
            font-size: 18px;
            line-height: 20px;
        }
        .drop-zone-active .input-box {
            border-color: var(--primary);
            box-shadow:
                0 0 0 3px var(--primary-soft);
        }
        /* =====================================================
           TOAST
        ===================================================== */
        .toast-container {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 5000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            min-width: 220px;
            max-width: 340px;
            padding: 12px 15px;
            border-radius: 12px;
            background: rgba(31, 41, 55, .95);
            color: #ffffff;
            box-shadow:
                0 10px 30px rgba(0, 0, 0, .18);
            font-size: 13px;
            animation:
                toastIn .25s ease,
                toastOut .25s ease 2.75s forwards;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes toastOut {
            to {
                opacity: 0;
                transform: translateY(10px);
            }
        }
        /* =====================================================
           VOICE
        ===================================================== */
        .voice-panel {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            background:
                radial-gradient(
                    circle at center,
                    rgba(37, 99, 235, .18),
                    rgba(0, 0, 0, .92)
                );
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }
        .voice-panel.show {
            display: flex;
        }
        .voice-box {
            width: min(700px, 95%);
            min-height: min(650px, 90vh);
            padding: 45px 30px;
            border-radius: 32px;
            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, .12),
                    rgba(255, 255, 255, .04)
                );
            border: 1px solid rgba(255, 255, 255, .16);
            color: #ffffff;
            text-align: center;
            box-shadow:
                0 30px 100px rgba(0, 0, 0, .45);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .voice-title {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .voice-subtitle {
            color: rgba(255, 255, 255, .65);
            font-size: 15px;
            margin-bottom: 45px;
        }
        .voice-ai {
            position: relative;
            width: 230px;
            height: 230px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }
        .voice-ai::before,
        .voice-ai::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(96, 165, 250, .35);
            opacity: 0;
            transform: scale(.7);
        }
        .voice-ai::before {
            width: 180px;
            height: 180px;
        }
        .voice-ai::after {
            width: 230px;
            height: 230px;
        }
        .voice-ai.active::before {
            animation: voicePulse 1.8s infinite;
        }
        .voice-ai.active::after {
            animation:
                voicePulse 1.8s infinite .4s;
        }
        @keyframes voicePulse {
            0% {
                opacity: 0;
                transform: scale(.7);
            }
            35% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: scale(1.2);
            }
        }
        .voice-core {
            width: 125px;
            height: 125px;
            border-radius: 50%;
            background:
                radial-gradient(
                    circle at 35% 30%,
                    #ffffff,
                    #60a5fa 28%,
                    #2563eb 62%,
                    #1e3a8a
                );
            box-shadow:
                0 0 35px rgba(59, 130, 246, .55),
                0 0 80px rgba(37, 99, 235, .25);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
        }
        .voice-core span {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
        }
        .voice-ai.active .voice-core {
            animation:
                voiceCore .9s ease-in-out infinite alternate;
        }
        @keyframes voiceCore {
            from {
                transform: scale(.94);
                box-shadow:
                    0 0 35px rgba(59, 130, 246, .55),
                    0 0 70px rgba(37, 99, 235, .25);
            }
            to {
                transform: scale(1.08);
                box-shadow:
                    0 0 55px rgba(96, 165, 250, .85),
                    0 0 120px rgba(37, 99, 235, .45);
            }
        }
        .voice-waves {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .voice-wave {
            width: 4px;
            height: 20px;
            border-radius: 10px;
            background: rgba(147, 197, 253, .8);
            opacity: .25;
            position: absolute;
        }
        .voice-ai.active .voice-wave {
            animation:
                wave .7s ease-in-out infinite alternate;
        }
        .voice-wave:nth-child(1) {
            transform: translateX(-105px);
            animation-delay: 0s;
        }
        .voice-wave:nth-child(2) {
            transform: translateX(-85px);
            animation-delay: .1s;
        }
        .voice-wave:nth-child(3) {
            transform: translateX(-65px);
            animation-delay: .2s;
        }
        .voice-wave:nth-child(4) {
            transform: translateX(65px);
            animation-delay: .2s;
        }
        .voice-wave:nth-child(5) {
            transform: translateX(85px);
            animation-delay: .1s;
        }
        .voice-wave:nth-child(6) {
            transform: translateX(105px);
            animation-delay: 0s;
        }
        @keyframes wave {
            from {
                height: 15px;
                opacity: .35;
            }
            to {
                height: 65px;
                opacity: 1;
            }
        }
        .voice-status {
            min-height: 25px;
            color: rgba(255, 255, 255, .85);
            font-size: 16px;
            margin-bottom: 28px;
        }
        .voice-start {
            min-width: 190px;
            height: 50px;
            padding: 0 25px;
            border-radius: 14px;
            background: #ffffff;
            color: #111827;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }
        .voice-start:hover {
            background: #dbeafe;
        }
        .voice-start.recording {
            background: #ef4444;
            color: #ffffff;
        }
        .voice-close {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .1);
            border: 1px solid rgba(255, 255, 255, .12);
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;

            .input-box {

            textarea {

            }
            .composer-meta {

            .tools {

            .tool,

            .tool .icon,

            #previewImage {

            .toast-container {

            }
            .toast {
                width: 100%;

                padding: 10px 12px;
                font-size: 12px;
            }
            .voice-panel {
                padding: 8px;
            }
            .voice-box {
                width: 100%;
                min-height: min(580px, 92dvh);
                max-height: 94dvh;
                padding:
                    28px 15px

            }
            .voice-title {
                font-size: 22px;

                min-width: 170px;

                font-size: 13px;

        /* =====================================================

        ===================================================== */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>

        function showToast(message) {
            if (!message) {
                return;

            const toast =
                document.createElement("div");
            toast.className = "toast";
            toast.textContent = message;
            toastContainer.appendChild(toast);
            setTimeout(
                function () {
                    if (toast.parentNode) {
                        toast.remove();
                    }
                },
                3100
            );
        }

                }
            );

            sidebar.classList.remove("open");
            sidebarOverlay.style.opacity = "0";

        /* =========================================================
           STORAGE
        ========================================================= */
        function loadConversations() {
            try {
                const saved =
                    localStorage.getItem(
                        STORAGE_CONVERSATIONS
                    );
                conversations =
                    saved
                        ? JSON.parse(saved)
                        : [];
                if (!Array.isArray(conversations)) {
                    conversations = [];
                }
            } catch (error) {
                console.error(
                    "Conversation load error:",
                    error
                );
                conversations = [];
            }
        }
        function saveConversations() {
            try {
                localStorage.setItem(
                    STORAGE_CONVERSATIONS,
                    JSON.stringify(conversations)
                );
            } catch (error) {
                console.error(
                    "Conversation save error:",
                    error
                );
                showToast(
                    "تعذر حفظ المحادثات في المتصفح."
                );
            }
        }
        /* =========================================================
           CURRENT CONVERSATION
        ========================================================= */
        function createConversation() {
            return {
                id:
                    "chat_" +
                    Date.now() +
                    "_" +
                    Math.random()
                        .toString(36)
                        .slice(2),
                title: "محادثة جديدة",
                date:
                    new Date().toISOString(),
                messages: []
            };
        }
        function saveCurrentConversation() {
            if (
                !currentConversation ||
                !currentConversation.messages.length
            ) {
                return;
            }
            const existingIndex =
                conversations.findIndex(
                    function (item) {
                        return (
                            item.id ===
                            currentConversation.id
                        );
                    }
                );
            currentConversation.date =
                new Date().toISOString();
            if (existingIndex >= 0) {
                conversations[existingIndex] =
                    currentConversation;
            } else {
                conversations.unshift(
                    currentConversation
                );
            }
            if (conversations.length > 50) {
                conversations =
                    conversations.slice(
                        0,
                        50
                    );
            }
            saveConversations();
            try {
                localStorage.setItem(
                    STORAGE_CURRENT,
                    JSON.stringify(
                        currentConversation
                    )
                );
            } catch (error) {
                console.debug(
                    "Current conversation save failed."
                );
            }
            renderHistory();
        }
        function addConversationMessage(
            role,
            text,
            image = null
        ) {
            if (!currentConversation) {
                currentConversation =
                    createConversation();
            }
            currentConversation.messages.push({
                role: role,
                text: text || "",
                image: image || null,
                date:
                    new Date().toISOString()
            });
            if (
                currentConversation.title ===
                "محادثة جديدة" &&
                role === "user"
            ) {
                currentConversation.title =
                    text
                        ? text.slice(0, 60)
                        : "تحليل صورة";
            }
            saveCurrentConversation();
        }

        function resizeTextarea() {
            questionInput.style.height = "auto";
            const height =
                Math.min(
                    Math.max(
                        questionInput.scrollHeight,
                        38
                    ),
                    window.innerWidth <= 750
                        ? 115
                        : 150
                );
            questionInput.style.height =
                height + "px";
        }
        function updateCharacterCount() {
            const length =
                questionInput.value.length;
            characterCount.textContent =
                `${length} / ${MAX_MESSAGE_LENGTH}`;
            characterCount.style.color =
                length >= MAX_MESSAGE_LENGTH
                    ? "var(--danger)"
                    : "var(--muted)";
        }
        questionInput.addEventListener(
            "input",
            function () {
                if (
                    questionInput.value.length >
                    MAX_MESSAGE_LENGTH
                ) {
                    questionInput.value =
                        questionInput.value.slice(
                            0,
                            MAX_MESSAGE_LENGTH
                        );
                }
                resizeTextarea();
                updateCharacterCount();
            }
        );
        /* =========================================================
           SUGGESTIONS
        ========================================================= */
        suggestions.forEach(
            function (button) {
                button.addEventListener(
                    "click",
                    function () {
                        questionInput.value =
                            button.dataset.prompt ||
                            "";
                        resizeTextarea();
                        updateCharacterCount();
                        questionInput.focus();
                    }
                );
            }
        );

        questionInput.addEventListener(

                               voiceStatus.textContent =
                                   "جاري إرسال كلامك إلى Aido AI...";
                               chatForm.requestSubmit();
                           } else {
                               voiceStatus.textContent =
                                   "لم ألتقط كلامًا واضحًا.";
                               voiceMode =
                                   false;
                               voiceStart.textContent =
                                   "بدء المحادثة";
                           }
                       } else {
                           voiceAI.classList.remove(
                               "active"
                           );
                       }
                   };
               return true;
           } catch (error) {
               console.error(
                   "Speech setup error:",
                   error
               );
               recognition = null;
               return false;
           }
       }
       speechAvailable =
           setupSpeechRecognition();
       /* =========================================================
          MICROPHONE
       ========================================================= */
       micBtn.addEventListener(
           "click",
           function () {
               if (!speechAvailable) {
                   showToast(
                       "المتصفح لا يدعم تحويل الكلام إلى نص."
                   );
                   return;
               }
               if (!recognition) {
                   return;
               }
               if (isRecording) {
                   recognition.stop();
               } else {
                   voiceMode = false;
                   try {
                       recognition.start();
                   } catch (error) {
                       console.error(
                           "Recognition start error:",
                           error
                       );
                   }
               }
           }
       );
       /* =========================================================
          VOICE PANEL
       ========================================================= */
       voiceChatBtn.addEventListener(
           "click",
           function () {
               if (!speechAvailable) {
                   showToast(
                       "المتصفح لا يدعم المحادثة الصوتية."
                   );
                   return;
               }
               voicePanel.classList.add(
                   "show"
               );
               voiceStatus.textContent =
                   "اضغط لبدء المحادثة";
           }
       );
       voiceClose.addEventListener(
           "click",
           function () {
               stopVoiceChat();
               voicePanel.classList.remove(
                   "show"
               );
           }
       );
       voicePanel.addEventListener(
           "click",
           function (event) {
               if (
                   event.target ===
                   voicePanel
               ) {
                   stopVoiceChat();
                   voicePanel.classList.remove(
                       "show"
                   );
               }
           }
       );
       /* =========================================================
          START VOICE
       ========================================================= */
       voiceStart.addEventListener(
           "click",
           function () {
               if (!speechAvailable) {
                   showToast(
                       "المتصفح لا يدعم المحادثة الصوتية."
                   );
                   return;
               }
               if (!recognition) {
                   return;
               }
               if (isRecording) {
                   stopVoiceChat();
                   return;
               }
               stopReading(false);
               voiceMode = true;
               questionInput.value = "";
               resizeTextarea();
               updateCharacterCount();
               voiceStart.classList.add(
                   "recording"
               );
               voiceStart.textContent =
                   "إيقاف المحادثة";
               voiceStatus.textContent =
                   "أستمع إليك الآن...";
               voiceAI.classList.add(
                   "active"
               );
               try {
                   recognition.start();
               } catch (error) {
                   console.error(
                       "Voice start error:",
                       error
                   );
                   voiceMode = false;
                   voiceAI.classList.remove(
                       "active"
                   );
                   voiceStart.classList.remove(
                       "recording"
                   );
                   voiceStart.textContent =
                       "بدء المحادثة";
                   voiceStatus.textContent =
                       "تعذر بدء المحادثة الصوتية.";
               }
           }
       );
       /* =========================================================
          STOP VOICE
       ========================================================= */
       function stopVoiceChat() {
           voiceMode = false;
           isRecording = false;
           voiceAI.classList.remove(
               "active"
           );
           if (recognition) {
               try {
                   recognition.stop();
               } catch (error) {
                   console.debug(
                       "Recognition already stopped."
                   );
               }
           }
           micBtn.classList.remove(
               "active"
           );
           voiceStart.classList.remove(
               "recording"
           );
           voiceStart.textContent =
               "بدء المحادثة";
           voiceStatus.textContent =
               "اضغط لبدء المحادثة";
       }
       /* =========================================================
          KEYBOARD SHORTCUTS
       ========================================================= */
       document.addEventListener(
           "keydown",
           function (event) {
               if (
                   (event.ctrlKey ||
                       event.metaKey) &&
                   event.key.toLowerCase() ===
                       "k"
               ) {
                   event.preventDefault();
                   questionInput.focus();
                   return;
               }
               if (
                   (event.ctrlKey ||
                       event.metaKey) &&
                   event.key.toLowerCase() ===
                       "n"
               ) {
                   event.preventDefault();
                   clearChat(
                       true,
                       true
                   );
                   questionInput.value = "";
                   resizeTextarea();
                   updateCharacterCount();
                   questionInput.focus();
                   return;
               }
               if (event.key === "Escape") {
                   stopReading(false);
                   stopVoiceChat();
                   voicePanel.classList.remove(
                       "show"
                   );
                   closeSidebar();
               }
           }
       );
       /* =========================================================
          PAGE VISIBILITY
       ========================================================= */
       document.addEventListener(
           "visibilitychange",
           function () {
               if (document.hidden) {
                   stopReading(false);
               }
           }
       );
       /* =========================================================
          WINDOW RESIZE
       ========================================================= */
       window.addEventListener(
           "resize",
           function () {
               resizeTextarea();
           }
       );
       /* =========================================================
          ONLINE / OFFLINE
       ========================================================= */
       window.addEventListener(
           "online",
           function () {
               setOnlineStatus(true);
           }
       );
       window.addEventListener(
           "offline",
           function () {
               setOnlineStatus(false);
           }
       );
       /* =========================================================
          INITIALIZE
       ========================================================= */
       loadConversations();
       loadTheme();
       loadBackground();
       renderHistory();
       currentConversation =
           createConversation();
       resizeTextarea();
       updateCharacterCount();
       updateReadingButton();
       setOnlineStatus(
           navigator.onLine
       );
   </script>
</body>
</html>
